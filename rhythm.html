<section id="home" hidden><button class="secondary" id="setup-back">← タイトル</button><div class="eyebrow">ENGLISH RHYTHM / CIRCLE</div><h1>この文を練習しよう</h1><p class="muted meaning">円形リズム · 41文チャレンジ</p><div class="panel"><div class="sentence" id="setup-sentence"></div><p class="meaning lesson-meaning"></p><p class="note"><span id="setup-stages"></span></p></div><div class="panel"><h2>遊び方を選ぶ</h2><div class="choices" id="modes"><button class="choice" data-mode="basic" aria-pressed="true">基本 <small>配置は固定。玉を見ながら語順に慣れよう。</small></button><button class="choice" data-mode="shuffle" aria-pressed="false">シャッフル <small>１周ごとに配置が変わる。玉を打ち返して中央のコアを攻撃！</small></button><button class="choice" data-mode="predict" aria-pressed="false">思い出す・先読み <small>ゆっくり進行。正しい順にバリアを張ろう。いくつでも先に準備OK！</small></button></div><div class="panel"><strong>スピード</strong><div class="choices" id="speeds" style="margin-top:8px"><button class="choice" data-speed="normal" aria-pressed="true">通常</button><button class="choice" data-speed="fast" aria-pressed="false">高速 · 得点1.5倍<small>玉とテンポは1.25倍。発音の速さはそのまま。</small></button></div></div><div class="practice-setting"><label for="practice-length">練習の長さ</label><br><select id="practice-length"><option value="normal">じっくり：まとまり２回＋全文２回</option><option value="short">短縮：全文１回 → 並び替え</option></select></div><label class="note" style="display:block;margin-top:12px">効果音の音量 <input id="fx-volume" type="range" min="0" max="100" value="45" aria-label="効果音の音量" style="width:100%"></label><p id="audio-status" class="note" role="status"></p><button id="silent-start" class="secondary wide" hidden>音の確認をせずに始める</button><button id="start" class="primary wide">このモードでスタート ▶</button><p class="note">どのモードも押すと発音します。音の出る状態でどうぞ。玉を打ち返して中央に命中すると得点。玉と丸いリングが重なった瞬間が押すタイミング。先読みではリングにバリアを張れます。</p></div><p class="note">学習記録はこの端末のブラウザに保存されます。</p></section>
<section id="play" hidden><div class="top"><button id="home-button" class="secondary">← タイトル</button><strong id="mode-name"></strong><button id="pause" class="secondary">一時停止</button></div><div class="metrics"><span id="score">0点</span><span id="combo">0 COMBO</span></div><div id="lesson-label" class="note"></div><div id="stage" class="stage"></div><div id="instruction" class="instruction"></div><div class="progress"><span id="progress"></span></div><div id="barrier-time" class="barrier-time" hidden></div><div id="board" class="board"><svg class="wires" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"></svg><div class="cloud" id="cloud" hidden aria-label="玉を隠す雲"></div><div class="center" id="center">CORE</div><div class="damage" id="damage" hidden></div><div id="overlay" class="overlay" hidden><strong id="overlay-title"></strong><p id="overlay-text"></p><button id="resume" class="primary" hidden>再開 ▶</button></div></div><div id="feedback" class="feedback" aria-live="polite"></div><p class="hint" id="hint"></p></section>
<section id="finale" hidden><div class="top"><button id="final-home" class="secondary">← タイトル</button><span>仕上げ</span></div><div class="panel"><h2>英文を組み立てよう</h2><p class="meaning lesson-meaning"></p><p class="note">正しい順に押そう。押すと発音します。上の語を押すと戻せます。</p><div id="final-time" class="barrier-time"></div><div id="answer" class="answer"></div><div id="bank" class="chips"></div><button id="check" class="primary wide">答え合わせ</button><p id="final-feedback" aria-live="polite"></p><button id="model" class="secondary wide">見本を聞く</button><div id="result" hidden><div id="achievement-notice" role="status"></div><div class="resultscore" id="result-score"></div><p id="result-detail"></p></div></div></section>
<div id="result-actions" class="result-actions" hidden><button class="primary wide" id="next-lesson">次の文へ →</button><div class="row"><button id="again" class="secondary">もう１回</button><button id="choose" class="secondary">タイトルへ</button></div></div></main><script>

// 金属バット「カキーン！」波形生成（チュイーン原因の周波数上昇を廃止し、硬い打撃衝撃＋非整数倍音の金属共鳴を合成）
function buildBatBuffer(){
  const rate=effects.sampleRate,len=Math.ceil(rate*0.65),buf=effects.createBuffer(1,len,rate),data=buf.getChannelData(0);
  let seed=987654321,peak=0;
  // 高校野球の金属バット特有の非整数倍音（不協和な高域群）
  const modes=[
    {f:2180,amp:0.55,decay:9.5},
    {f:3140,amp:0.48,decay:11.0},
    {f:4450,amp:0.35,decay:14.0},
    {f:5920,amp:0.22,decay:18.0},
    {f:1120,amp:0.28,decay:22.0} // バット本体のコシのある中域
  ];
  for(let i=0;i<len;i++){
    const t=i/rate;
    seed=(seed*1664525+1013904223)>>>0;
    const white=seed/4294967296*2-1;
    // 1. ボールがバットにめり込んで弾ける瞬間の「バシッ！」という硬い衝撃音
    const crack=white*Math.exp(-t*140)*0.85;
    const woodSnap=Math.sin(2*Math.PI*(950*Math.exp(-t*70)+180)*t)*Math.exp(-t*85)*0.65;
    // 2. 金属バットの「キーン！」という共鳴（打撃直後にわずかにピッチが落ち着くリアルな挙動）
    let ring=0;
    for(const m of modes){
      const bend=1+0.012*Math.exp(-t*60);
      ring+=Math.sin(2*Math.PI*m.f*bend*t)*m.amp*Math.exp(-t*m.decay);
    }
    const env=Math.min(1,t/0.0015);
    data[i]=(crack+woodSnap+ring*0.8)*env;
    peak=Math.max(peak,Math.abs(data[i]));
  }
  for(let i=0;i<len;i++)data[i]=data[i]/Math.max(1,peak)*0.95;
  return buf;
}

// 汎用ノイズバッファ（発射の空気音・コア命中時の爆発クラッシュ用）
function buildNoiseBuffer(){
  const rate=effects.sampleRate,len=Math.ceil(rate*0.5),buf=effects.createBuffer(1,len,rate),data=buf.getChannelData(0);
  let seed=123456789;
  for(let i=0;i<len;i++){
    seed=(seed*1664525+1013904223)>>>0;
    data[i]=seed/4294967296*2-1;
  }
  return buf;
}

async function unlockEffects(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;if(!effects){effects=new AC();fxMaster=effects.createGain();fxMaster.gain.value=Number($('#fx-volume').value||45)/100;fxLimiter=effects.createDynamicsCompressor();fxLimiter.threshold.value=-14;fxLimiter.knee.value=10;fxLimiter.ratio.value=6;fxLimiter.attack.value=.002;fxLimiter.release.value=.15;fxMaster.connect(fxLimiter);fxLimiter.connect(effects.destination);batBuffer=buildBatBuffer();noiseBuffer=buildNoiseBuffer();}if(effects.state!=='running')await effects.resume();return effects.state==='running';}catch{return false;}}

// 反射音：金属バットで打ち返す「カキーン！」（高得点時はより澄んだ快音に）
function bounceSound(points=100){
  try{
    if(!effects||effects.state!=='running'||!batBuffer)return;
    const t=effects.currentTime;
    const source=effects.createBufferSource(),gain=effects.createGain();
    source.buffer=batBuffer;
    // ジャストミート(100/150点)は少し高めで澄んだカキーン、70点は少し鈍めのカキン
    source.playbackRate.setValueAtTime(points>=100?1.04:0.93,t);
    gain.gain.setValueAtTime(points>=100?0.85:0.65,t);
    source.connect(gain);gain.connect(fxMaster);
    source.start(t);
    source.onended=()=>{source.disconnect();gain.disconnect();};
  }catch{}
}

// 発射音：ピッチングマシンや穴からボールが飛び出す「ポンッ！」
function launchSound(){
  try{
    if(!effects||effects.state!=='running')return;
    const t=effects.currentTime;
    // 1. 筒の中の空気が膨張して弾ける「ポンッ」の胴鳴り（急激に上がって一気に落ちるピッチ）
    const o=effects.createOscillator(),g=effects.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(130,t);
    o.frequency.exponentialRampToValueAtTime(340,t+0.018);
    o.frequency.exponentialRampToValueAtTime(88,t+0.11);
    g.gain.setValueAtTime(0.001,t);
    g.gain.linearRampToValueAtTime(0.55,t+0.006);
    g.gain.exponentialRampToValueAtTime(0.001,t+0.12);
    o.connect(g);g.connect(fxMaster);
    o.start(t);o.stop(t+0.13);
    o.onended=()=>{o.disconnect();g.disconnect();};

    // 2. 穴から押し出される「ボフッ」という空気圧ノイズ
    if(noiseBuffer){
      const n=effects.createBufferSource(),filter=effects.createBiquadFilter(),ng=effects.createGain();
      n.buffer=noiseBuffer;
      filter.type='bandpass';
      filter.frequency.setValueAtTime(520,t);
      filter.Q.setValueAtTime(2.2,t);
      ng.gain.setValueAtTime(0.35,t);
      ng.gain.exponentialRampToValueAtTime(0.001,t+0.045);
      n.connect(filter);filter.connect(ng);ng.connect(fxMaster);
      n.start(t);n.stop(t+0.05);
      n.onended=()=>{n.disconnect();filter.disconnect();ng.disconnect();};
    }
  }catch{}
}

// コア命中ダメージ音：打ち返したボールがコアに直撃したときの「ドゴォン！／バキッ！」
function impactSound(points=100){
  try{
    if(!effects||effects.state!=='running')return;
    const t=effects.currentTime;
    // 1. 重低音インパクト（ズシンと響くサブベースの急降下）
    const sub=effects.createOscillator(),subGain=effects.createGain();
    sub.type='triangle';
    sub.frequency.setValueAtTime(170,t);
    sub.frequency.exponentialRampToValueAtTime(28,t+0.26);
    subGain.gain.setValueAtTime(0.75,t);
    subGain.gain.exponentialRampToValueAtTime(0.001,t+0.28);
    sub.connect(subGain);subGain.connect(fxMaster);
    sub.start(t);sub.stop(t+0.29);
    sub.onended=()=>{sub.disconnect();subGain.disconnect();};

    // 2. コアの外殻が砕けるクランチ音（ノコギリ波のピッチドロップ）
    const crunch=effects.createOscillator(),crunchGain=effects.createGain();
    crunch.type='sawtooth';
    crunch.frequency.setValueAtTime(points>=100?320:240,t);
    crunch.frequency.exponentialRampToValueAtTime(45,t+0.15);
    crunchGain.gain.setValueAtTime(0.32,t);
    crunchGain.gain.exponentialRampToValueAtTime(0.001,t+0.16);
    crunch.connect(crunchGain);crunchGain.connect(fxMaster);
    crunch.start(t);crunch.stop(t+0.17);
    crunch.onended=()=>{crunch.disconnect();crunchGain.disconnect();};

    // 3. 爆発クラッシュノイズ（ローパスフィルターを閉じながら減衰）
    if(noiseBuffer){
      const n=effects.createBufferSource(),filter=effects.createBiquadFilter(),ng=effects.createGain();
      n.buffer=noiseBuffer;
      filter.type='lowpass';
      filter.frequency.setValueAtTime(2400,t);
      filter.frequency.exponentialRampToValueAtTime(140,t+0.24);
      ng.gain.setValueAtTime(0.65,t);
      ng.gain.exponentialRampToValueAtTime(0.001,t+0.25);
      n.connect(filter);filter.connect(ng);ng.connect(fxMaster);
      n.start(t);n.stop(t+0.26);
      n.onended=()=>{n.disconnect();filter.disconnect();ng.disconnect();};
    }
  }catch{}
}

function countCue(start=false){try{if(!effects||effects.state!=='running')return;const t=effects.currentTime,o=effects.createOscillator(),g=effects.createGain();o.type='sine';o.frequency.setValueAtTime(start?880:550,t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(start?.2:.13,t+.008);g.gain.exponentialRampToValueAtTime(.001,t+(start?.24:.1));o.connect(g);g.connect(fxMaster);o.start(t);o.stop(t+.28);o.onended=()=>{o.disconnect();g.disconnect();};}catch{}}

 {id:'green',title:'全部○にできた',levels:[11,41],value:f=>f.greenAll?41:f.greenUnit?11:0,unit:'文すべて最新○'}];}
function trophyLabel(d,n){return d.title+' · '+(d.id==='green'?(n===11?'Unit5':'全41文'):n.toLocaleString()+d.unit);}
function awardTrophies(){const f=trophyFacts(),newly=[];for(const d of trophyDefs())for(const n of d.levels){const k=d.id+':'+n;if(!records.trophies[k]&&d.value(f)>=n){records.trophies[k]=dayKey();newly.push(trophyLabel(d,n));}}return newly;}
function trophySummary(){const defs=trophyDefs(),f=trophyFacts(),earned=defs.filter(d=>d.levels.some(n=>records.trophies[d.id+':'+n])).length;const candidates=defs.map(d=>({d,n:d.levels.find(n=>!records.trophies[d.id+':'+n])})).filter(x=>x.n);candidates.sort((a,b)=>Math.min(1,b.d.value(f)/b.n)-Math.min(1,a.d.value(f)/a.n));const goal=candidates[0];return {earned,next:goal?trophyLabel(goal.d,goal.n)+'（現在 '+goal.d.value(f).toLocaleString()+'）':'すべてのトロフィーを獲得しました！'};}
function showTrophies(){screen('hub');const f=trophyFacts();$('#hub').innerHTML='<button id="trophy-back">← タイトル</button><h1>🏆 トロフィー</h1><p class="hub-note">１文を最後までクリアした日が学習日です。獲得したトロフィーは残ります。</p>'+trophyDefs().map(d=>{const won=d.levels.filter(n=>records.trophies[d.id+':'+n]),next=d.levels.find(n=>!records.trophies[d.id+':'+n]);return `<div class="trophy-card ${won.length?'earned':''}"><h3>${won.length?'🏆':'◇'} ${d.title}</h3><p>${won.length?won.map(n=>trophyLabel(d,n)+'：'+records.trophies[d.id+':'+n]).join('<br>'):'これから挑戦'}</p>${next?`<p>次は ${next.toLocaleString()}${d.unit} ／ 現在 ${d.value(f).toLocaleString()}</p><progress max="${next}" value="${Math.min(next,d.value(f))}"></progress>`:'<p>全段階を達成！</p>'}</div>`;}).join('')+'<p class="hub-note">自己ベストは例文・モード・速度・練習の長さごと。初回登録と同点は更新に数えません。全部○は並び替えの最初の答え合わせで判定します。</p>'+warnStorage();$('#trophy-back').onclick=showHub;window.scrollTo(0,0);}
function scoreRows(rows){return rows.length?rows.map(r=>{const l=lessons.find(l=>l.id===r.lessonId);if(!l)return '';return `<div class="record-item">${r.day} · ${l.title}<br><strong>${r.cleared?r.score+'点':'未クリア'}</strong> ／ ${names[r.mode]||'旧版'} · ${r.speed==='fast'?'高速':'通常'}  · ${r.practiceLength==='short'?'短縮':'じっくり'} ／ 並び替え初回 <span class="${r.ok?'yes':'no'}">${r.ok?'○':'×'}</span>${r.pb?' ／ 自己ベスト更新！':''}</div>`;}).join(''):'<p class="hub-note">まだ記録がありません。</p>';}
function showHub(){stop();phase='hub';currentAttempt=null;randomQueue=[];randomMode=false;randomDone=0;saveSettings();screen('hub');const pool=scopeIndices(),ids=new Set(pool.map(i=>lessons[i].id)),today=dayKey(),daily=firstDaily().filter(r=>ids.has(r.lessonId)&&r.day>=records.start&&r.day<=today),cleared=new Set(records.runs.filter(r=>r.cleared&&ids.has(r.lessonId)).map(r=>r.lessonId)).size,t=trophySummary(),facts=trophyFacts();
 $('#hub').innerHTML=`<a href="index.html" class="subtle-link">← 英語の学習室</a><p class="hub-lead">ENGLISH RHYTHM · CIRCLE / 41 SENTENCES</p><h1>英語リズム</h1><p class="hub-lead">聞いて、打ち返して、英文を覚えよう。</p><div class="scope-switch"><button id="scope-all" aria-pressed="${practiceScope==='all'}">全41文</button><button id="scope-unit5" aria-pressed="${practiceScope==='unit5'}">Unit5の11文</button></div><div class="hub-actions"><button class="go" id="resume-start">${records.resume[practiceScope]?'前回の続きから':'順番にはじめる'} ▶</button><button id="random-start">${scopeName()}からランダム５文</button></div><p class="hub-note">${records.resume[practiceScope]?.wrapped?'一周完了！ 先頭からもう一周。':(resumeIndex()+1)+'番「'+lessons[resumeIndex()].title+'」から'}<br>途中の文は最初から、クリア後は次の文から再開。</p><p class="setting-summary">${names[mode]} ／ ${speedMode==='fast'?'高速・得点1.5倍':'通常'} ／ ${practiceLength==='short'?'短縮・全文１回':'じっくり'}（開始前に変更できます）</p><div class="hub-card"><button id="open-trophies">🏆 トロフィー ${t.earned} / 10</button><p class="hub-note">次の目標：${t.next}</p><strong>自己ベスト更新 ${facts.pb}回</strong> · 累計 ${facts.total.toLocaleString()}点</div><button id="open-calendar">学習カレンダー・記録</button><div class="hub-card hub-stats"><div><b>${daily.filter(r=>r.day===today).length}</b>今日の文数</div><div><b>${cleared}/${pool.length}</b>クリアした文</div><div><b>${daily.length?Math.round(daily.filter(r=>r.ok).length/daily.length*100)+'％':'—'}</b>初回正解率</div></div><h2>文を選ぶ</h2><p class="hub-note">○×は直近２回の並び替え初回結果（左：前回 → 右：最新）。<br>最高点・更新回数は、選択中のモード・速度・練習の長さの記録です。</p><div class="lesson-table">${pool.map(i=>{const l=lessons[i],updates=records.runs.filter(r=>r.cleared&&r.lessonId===l.id&&r.mode===mode&&r.speed===speedMode&&(r.practiceLength||'normal')===practiceLength&&r.pb).length;return `<button class="lesson-row" data-lesson="${i}"><b>${String(i+1).padStart(2,'0')}</b><span>${l.title}<small>${lessonText(l)}<br>自己ベスト更新 ${updates}回</small></span><span class="history">${symbols(l.id)}</span><span>${bestFor(l.id)||'—'}<small>最高点</small></span></button>`;}).join('')}</div><h2>最近の得点</h2>${scoreRows(records.runs.filter(r=>r.cleared&&ids.has(r.lessonId)).slice(-5).reverse())}<details><summary>記録と得点について</summary><p class="hub-note">クリアした回の得点を累計します。バリアと並び替えの基準点はボタン数に比例し、速さは１個あたりの時間で評価します。高速は得点1.5倍。並び替えの解き直しでは最初の×を変更しません。カレンダーと正解率は、同じ日・同じ文の最初の結果を１文と数えます。<br>学習日は１文を最後までクリアした日。連続記録が途切れても獲得したトロフィーは残ります。記録はこの端末・ブラウザに保存され、別端末には同期しません。</p></details>${legacyRecord?'<details><summary>以前の横並び版の記録</summary><p class="hub-note">旧版の記録は保持しています。得点体系が異なるため、円形版の自己ベスト・トロフィーには合算しません。</p>'+scoreRows(legacyRecord.runs.filter(r=>r&&validDay(r.day)&&Number.isFinite(r.score)).slice(-10).reverse())+'</details>':''}${warnStorage()}`;
 $('#scope-all').onclick=()=>{practiceScope='all';records.scope=practiceScope;showHub();};$('#scope-unit5').onclick=()=>{practiceScope='unit5';records.scope=practiceScope;showHub();};$('#resume-start').onclick=()=>selectLesson(resumeIndex());$('#random-start').onclick=startRandom;$('#open-trophies').onclick=showTrophies;$('#open-calendar').onclick=()=>{calMonth=today.slice(0,7);calDay=today;showCalendar();};$('#hub').querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>selectLesson(Number(b.dataset.lesson)));window.scrollTo(0,0);}

function accuracyTrend(){const today=dayKey(),base=Date.parse(today+'T00:00:00Z'),cut=n=>new Date(base-n*86400000).toISOString().slice(0,10),rows=firstDaily().filter(r=>r.day>=records.start&&r.day<=today),recent=rows.filter(r=>r.day>=cut(6)),before=rows.filter(r=>r.day>=cut(13)&&r.day<cut(6)),rate=a=>a.length?Math.round(a.filter(r=>r.ok).length/a.length*100):null,a=rate(recent),b=rate(before);return `<div class="hub-card"><h2>正解率の変化</h2><p>直近７日：${a===null?'記録なし':a+'％（'+recent.length+'文）'}<br>その前の７日：${b===null?'記録なし':b+'％（'+before.length+'文）'}</p><p class="hub-note">${a!==null&&b!==null?(a>b?'前の７日より '+(a-b)+'ポイント上がっています。':a<b?'前の７日より '+(b-a)+'ポイント下がっています。':'同じ正解率です。'):'両方の期間に記録があると比較できます。'} 文や出題数の違いでも変わるので目安です。</p></div>`;}

function monthSummary(month,today){const start=[month+'-01',records.start].sort().at(-1),d=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0),end=[dayKey(d),today].sort()[0];const days=Math.max(0,Math.round((Date.parse(end+'T00:00:00Z')-Date.parse(start+'T00:00:00Z'))/86400000)+1);const rows=firstDaily().filter(r=>r.day>=start&&r.day<=end);return {days,rows,start,end,average:days?(rows.length/days).toFixed(1):'—'};}
function showCalendar(){const today=dayKey(),sum=monthSummary(calMonth,today),offset=new Date(calMonth+'-01T12:00:00').getDay(),last=new Date(Number(calMonth.slice(0,4)),Number(calMonth.slice(5)),0).getDate();let cells='<span></span>'.repeat(offset);const daily=firstDaily();for(let n=1;n<=last;n++){const d=calMonth+'-'+String(n).padStart(2,'0'),out=d<records.start||d>today,count=daily.filter(r=>r.day===d).length;cells+=`<button class="cal-day ${out?'out':count>=5?'dark':count>=3?'medium':count?'light':''} ${d===calDay?'chosen':''}" data-date="${d}" aria-label="${d} ${out?'集計対象外':count+'文'}"><strong>${n}</strong><small>${out?'—':count+'文'}</small></button>`;}
 const rows=daily.filter(r=>r.day===calDay),eligible=calDay>=records.start&&calDay<=today;
 $('#hub').innerHTML=`<button id="calendar-back">← タイトル</button><h1>学習カレンダー</h1><div class="month-nav"><button id="month-prev" aria-label="前の月">‹</button><h2>${calMonth.replace('-','年')}月</h2><button id="month-next" aria-label="次の月" ${calMonth>=today.slice(0,7)?'disabled':''}>›</button></div><div class="week">${['日','月','火','水','木','金','土'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="calendar-grid">${cells}</div><p class="hub-note">灰：0文　薄緑：1〜2文　緑：3〜4文　濃緑：5文以上</p><div class="hub-card"><h2>${calDay}</h2>${eligible?`<p>${rows.length}文 ／ 初回正解 ${rows.filter(r=>r.ok).length}文</p>${scoreRows(records.runs.filter(r=>r.day===calDay).slice().reverse())}`:'<p>集計対象外の日です。</p>'}</div><div class="hub-card"><h2>この月の記録</h2><div class="hub-stats"><div><b>${sum.rows.length}</b>文数</div><div><b>${sum.average}</b>１日平均</div><div><b>${sum.rows.length?Math.round(sum.rows.filter(r=>r.ok).length/sum.rows.length*100)+'％':'—'}</b>初回正解率</div></div><p class="hub-note">${sum.days?sum.start+'〜'+sum.end+'の'+sum.days+'日間（未学習日を含む）':'対象期間がありません。'}</p></div>${accuracyTrend()}<details><summary>使用開始日の設定</summary><label>開始日<input class="date-input" id="start-date" type="date" value="${records.start}" min="2000-01-01" max="${today}"></label><button id="save-start">保存</button><p id="date-message" role="status"></p><p class="hub-note">初期値は2026年10月19日。変更しても記録は削除されません。過去の○×・学習日は追加した日から記録します。</p></details>${warnStorage()}`;
 $('#calendar-back').onclick=showHub;$('#month-prev').onclick=()=>moveMonth(-1);$('#month-next').onclick=()=>moveMonth(1);$('#hub').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{calDay=b.dataset.date;showCalendar();});$('#save-start').onclick=()=>{const d=$('#start-date').value;if(!validDay(d)||d<'2000-01-01'||d>today){$('#date-message').textContent='今日以前の有効な日付を選んでください。';return;}records.start=d;saveRecords();showCalendar();$('#hub').querySelector('details').open=true;$('#date-message').textContent=recordStorageOK?'保存しました。':'保存できませんでした。';};
}
function moveMonth(n){const d=new Date(calMonth+'-01T12:00:00');d.setMonth(d.getMonth()+n);calMonth=dayKey(d).slice(0,7);calDay=calMonth===dayKey().slice(0,7)?dayKey():calMonth+'-01';showCalendar();}


initCircle();showHub();
$('#practice-length').onchange=()=>{practiceLength=$('#practice-length').value;saveSettings();selectLesson(lessonIndex)};
</script></body></html>
