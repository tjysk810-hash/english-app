</style><main id="game"><header><strong>♪ 英語リズム</strong><label>音声 <select id="mode"><option value="tap">押すたびに発音</option><option value="phrase">タップ音＋最後にまとまり</option></select></label><span class="spacer"></span><button id="listen">見本を聞く</button><button id="pause" disabled>一時停止</button><button id="reset">最初から</button></header><label class="lesson-picker">練習する文 <select id="lesson-select" aria-label="練習する文"></select></label><div class="sentence" id="sentence"></div><div class="info"><span id="round">１・２回目：how → to → use</span><span id="status" role="status" aria-live="polite">準備できたらスタート</span><span id="score">0 / 0</span></div><div id="combo" aria-live="polite">COMBO 0</div><section id="finish-panel" hidden></section><div id="arena"><div class="overlay" id="overlay"><div><h2 id="title">まとまりを、リズムで覚えよう</h2><p id="message">玉が黄色い線に来たらタップ。短い語は半拍、長い語句は２拍。<br>まずは how → to → use をゆっくり２回。<br>these products は、１つのボタンです。</p><button class="go" id="go">スタート ▶</button></div></div></div><div class="bottom"><span>語句に合わせて半拍・１拍・２拍。４回の後は並び替え！</span><span id="speech-note">端末によって発音に遅れがあります。</span></div></main><script>
'use strict';
const lessons=[{"id": 1, "title": "教えられる", "words": ["I", "can", "show", "you", "how to use", "these products"], "meaning": "私はあなたにこれらの製品の使い方を教えられます。", "part": [0, 1, 2, 3], "beats": [0.5, 0.5, 1, 0.5, 2, 2], "end": "."}, {"id": 2, "title": "確信している", "words": ["I", "am", "sure", "that", "these ideas", "help many people"], "meaning": "私はこれらのアイデアが多くの人の役に立つと確信しています。", "part": [0, 1, 2, 3], "beats": [0.5, 0.5, 1, 0.5, 2, 2], "end": "."}, {"id": 3, "title": "アプリを勧める", "words": ["Why", "don't", "you", "try", "this app"], "meaning": "このアプリを試してみませんか。", "part": [0, 1, 2], "beats": [1, 1, 0.5, 1, 2], "end": "?"}, {"id": 4, "title": "先生に聞く", "words": ["Why", "don't", "you", "ask", "your teacher"], "meaning": "先生に聞いてみたらどうですか。", "part": [0, 1, 2], "beats": [1, 1, 0.5, 1, 2], "end": "?"}, {"id": 5, "title": "何をするか", "words": ["I", "know", "what", "to", "do", "next"], "meaning": "私は次に何をすればよいか分かっています。", "part": [2, 3, 4], "beats": [0.5, 1, 1, 0.5, 1, 1], "end": "."}, {"id": 6, "title": "何を持っていくか", "words": ["Please", "tell", "me", "what", "to", "bring"], "meaning": "何を持っていけばよいか教えてください。", "part": [0, 1, 2], "beats": [1, 1, 0.5, 1, 0.5, 1], "end": "."}, {"id": 7, "title": "どこに置くか", "words": ["I", "don't know", "where", "to", "put", "this box"], "meaning": "私はこの箱をどこに置けばよいか分かりません。", "part": [2, 3, 4], "beats": [0.5, 2, 1, 0.5, 1, 2], "end": "."}, {"id": 8, "title": "いつ始めるか", "words": ["Please", "tell", "me", "when", "to", "start"], "meaning": "いつ始めればよいか教えてください。", "part": [0, 1, 2], "beats": [1, 1, 0.5, 1, 0.5, 1], "end": "."}, {"id": 9, "title": "うれしい", "words": ["I", "am", "glad", "that", "you", "like this game"], "meaning": "あなたがこのゲームを気に入ってくれてうれしいです。", "part": [0, 1, 2, 3], "beats": [0.5, 0.5, 1, 0.5, 0.5, 2], "end": "."}, {"id": 10, "title": "〜と思う", "words": ["I", "think", "that", "we", "can", "help other people"], "meaning": "私は私たちがほかの人の役に立てると思います。", "part": [0, 1, 2], "beats": [0.5, 1, 0.5, 0.5, 0.5, 2], "end": "."}];
let lessonIndex=0,lesson=lessons[0],words=lesson.words,wordBeats=lesson.beats,rounds=[];
function rhythmNotes(round){let at=travel+500;return round.ids.map(lane=>{const note={lane,at,hold:wordBeats[lane]*round.beat};at+=note.hold;return note;});}
const $=s=>document.querySelector(s),arena=$('#arena'),overlay=$('#overlay');let points=0,combo=0,maxCombo=0,perfects=0,goods=0,phase="rhythm",build=[],bank=[],checks=0,usedHint=false,solved=false;let nextTimer=0;let lanes=[],pads=[],roundIndex=0,notes=[],active=false,paused=false,startTime=0,pauseTime=0,frame=0,hits=0,attempts=0,roundHits=0,audio=null,voice=null,speechTimer=0,speechResolve=null,epoch=0;const travel=2000,windowMs=420;
const synth='speechSynthesis'in window?window.speechSynthesis:null;

function setupLesson(index){clearTimeout(nextTimer);epoch++;cancelAnimationFrame(frame);cancelSpeech();active=false;paused=false;phase='rhythm';lessonIndex=index;lesson=lessons[index];words=lesson.words;wordBeats=lesson.beats;
 const all=words.map((_,i)=>i);rounds=[{ids:lesson.part,beat:1250,rate:.75},{ids:lesson.part,beat:1250,rate:.75},{ids:all,beat:700,rate:1.2},{ids:all,beat:550,rate:1.45}];
 points=combo=maxCombo=perfects=goods=hits=attempts=roundIndex=0;lanes.forEach(l=>l.remove());lanes=[];pads=[];notes=[];
 arena.style.gridTemplateColumns=words.map(w=>w.length>12?'minmax(0,1.45fr)':w.includes(' ')?'minmax(0,1.25fr)':'minmax(0,1fr)').join(' ');
 words.forEach((word,i)=>{const lane=document.createElement('div');lane.className='lane';const runway=document.createElement('div');runway.className='runway';const b=document.createElement('button');b.className='pad';b.textContent=word;b.setAttribute('aria-label',word);b.onpointerdown=e=>{e.preventDefault();tap(i);};b.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();tap(i);}};lane.append(runway,b);arena.insertBefore(lane,overlay);lanes.push(lane);pads.push(b);});
 $('#finish-panel').hidden=true;arena.hidden=false;$('#listen').hidden=false;$('#listen').disabled=false;$('#mode').disabled=false;$('#pause').disabled=true;$('#pause').textContent='一時停止';paintRound();$('#status').textContent='準備できたらスタート';display('まとまりから、全文へ',lesson.part.map(i=>words[i]).join(' → ')+' を２回。その後、全文を２回練習して並び替えに挑戦！','スタート ▶',begin);
}

function paintRound(){const r=rounds[roundIndex];$('#sentence').innerHTML=words.map((w,i)=>'<span class="'+(r.ids.includes(i)?'on':'')+'">'+w+'</span>').join(' ')+lesson.end;lanes.forEach((l,i)=>{l.classList.toggle('inactive',!r.ids.includes(i));pads[i].disabled=!active||paused||!r.ids.includes(i);});$('#round').textContent=`${roundIndex+1} / 4回目 · ${roundIndex<2?'まとまりを練習':roundIndex===2?'全文に挑戦':'全文をテンポよく'}`;$('#score').textContent=`${points}点`;$('#combo').textContent=`${combo} COMBO · BEST ${maxCombo}`;}

function begin(){clearTimeout(nextTimer);epoch++;cancelSpeech();unlock();overlay.hidden=true;active=true;paused=false;roundHits=0;$('#mode').disabled=true;$('#listen').disabled=true;$('#pause').disabled=false;$('#pause').textContent='一時停止';notes.forEach(n=>n.el.remove());notes=[];rhythmNotes(rounds[roundIndex]).forEach(note=>{const el=document.createElement('div');el.className='ball';lanes[note.lane].firstChild.append(el);notes.push({...note,done:false,el});});startTime=performance.now();$('#status').textContent='玉が線に来たらタップ！';paintRound();cancelAnimationFrame(frame);frame=requestAnimationFrame(tick);}

 if($('#mode').value==='tap')speak(words[i],rounds[roundIndex].rate);else tone();
 pads[i].classList.add('flash');setTimeout(()=>pads[i].classList.remove('flash'),180);
 const elapsed=performance.now()-startTime,n=notes.find(n=>!n.done&&n.lane===i&&Math.abs(n.at-elapsed)<=windowMs);

async function complete(){active=false;$('#pause').disabled=true;paintRound();const token=epoch;$('#status').textContent='このまとまりを聞こう';if($('#mode').value==='phrase')await speak(rounds[roundIndex].ids.map(i=>words[i]).join(' '),rounds[roundIndex].rate);if(token!==epoch)return;$('#mode').disabled=false;$('#listen').disabled=false;
