<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>英語リズム｜縦向き試作</title><style>
*{box-sizing:border-box}body{margin:0;background:#101c2c;color:#f2f7ff;font-family:system-ui,sans-serif}button,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #58718d;background:#263c55;border-radius:10px;padding:8px 14px;font-weight:700}button:disabled{opacity:.4;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid #ffd97a}#game{height:100dvh;min-height:300px;display:flex;flex-direction:column;padding:8px max(12px,env(safe-area-inset-right)) 8px max(12px,env(safe-area-inset-left));gap:6px;max-width:1400px;margin:auto}header{display:flex;align-items:center;gap:10px;font-size:12px}header strong{font-size:16px}header .spacer{flex:1}select{color:white;background:#263c55;border:1px solid #58718d;border-radius:6px;padding:5px;max-width:210px}.sentence{text-align:center;font-size:clamp(16px,3vw,24px);font-weight:700;line-height:1.3}.sentence span{color:#8c9eb1}.sentence span.on{color:#ffe098}.info{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:#d1deee;min-height:18px}#arena{flex:1;min-height:110px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.65fr);gap:6px;position:relative}.lane{position:relative;border-radius:10px;overflow:hidden;background:#182a40;border:1px solid #30465e;display:flex;flex-direction:column}.lane.inactive{opacity:.38}.runway{position:relative;flex:1;overflow:hidden}.runway:after{content:'';position:absolute;bottom:15px;left:0;right:0;height:3px;background:#ffd16d;box-shadow:0 0 9px #ffd16d66}.ball{position:absolute;width:23px;height:23px;border-radius:50%;background:#8ff5e2;box-shadow:0 0 16px #6ee7d3;left:calc(50% - 11.5px);top:0}.pad{height:65px;flex-shrink:0;border-radius:0;border:0;border-top:2px solid #405c76;background:#264661;font-size:clamp(15px,3vw,25px);padding:3px;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}.pad.flash{background:#398b78}.pad.miss{background:#965327}.lane.inactive .pad{background:#1b2d41}.pad small{display:block;font-size:10px;font-weight:400;color:#d5e2ee}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:5;background:#101c2ce8;border-radius:10px;text-align:center;padding:12px}.overlay[hidden]{display:none}.overlay h2{font-size:22px;margin:4px}.overlay p{font-size:13px;line-height:1.6;margin:7px}.go{background:#ffe098;color:#142438;border:0;font-size:17px;padding:10px 28px}.bottom{display:flex;justify-content:space-between;font-size:11px;color:#b6c7dc}.rotate{display:none}#status{color:#ffe098;font-weight:700} @media(orientation:portrait){.rotate{display:block;background:#ffe098;color:#172535;padding:10px;text-align:center;font-weight:700}#game{height:calc(100dvh - 60px)}header{flex-wrap:wrap}.pad{font-size:13px;height:75px}.pad small{display:none}.sentence{font-size:17px}#arena{gap:3px}.bottom{font-size:10px}}@media(max-height:380px){.pad{height:49px}.pad small{display:none}header strong{font-size:13px}.sentence{font-size:18px}.bottom{display:none}}

/* Portrait: six narrow lanes in one row. */
@media(orientation:portrait){#game{height:100dvh;min-height:500px;padding:8px 10px max(8px,env(safe-area-inset-bottom));gap:8px}header{gap:6px}header strong{width:100%;font-size:17px}header label{font-size:11px}header button{padding:7px 10px;font-size:12px}header .spacer{display:none}header select{max-width:185px}.sentence{font-size:19px;line-height:1.4}.info{font-size:11px;flex-wrap:wrap}#arena{grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.65fr);grid-template-rows:minmax(0,1fr);gap:4px}.pad{height:76px;font-size:14px;overflow-wrap:normal}.pad[aria-label="these products"]{font-size:13px}.pad small{display:none}.lane.inactive{opacity:.45}.bottom{font-size:10px;gap:8px}.overlay h2{font-size:20px}}
</style><main id="game"><header><strong>♪ 英語リズム</strong><label>音声 <select id="mode"><option value="tap">押すたびに発音</option><option value="phrase">タップ音＋最後にまとまり</option></select></label><label><input type="checkbox" id="metronome" checked> 拍の音</label><span class="spacer"></span><button id="listen">見本を聞く</button><button id="pause" disabled>一時停止</button><button id="reset">最初から</button></header><div class="sentence" id="sentence"></div><div class="info"><span id="round">１・２回目：how → to → use</span><span id="status" role="status" aria-live="polite">準備できたらスタート</span><span id="score">0 / 0</span></div><div id="arena"><div class="overlay" id="overlay"><div><h2 id="title">まとまりを、リズムで覚えよう</h2><p id="message">玉が黄色い線に来たら、下の単語をタップ。<br>まずは how → to → use をゆっくり２回。<br>these products は、１つのボタンです。</p><button class="go" id="go">スタート ▶</button></div></div></div><div class="bottom"><span>タイミングが外れても発音します。全６回、自動で進みます。</span><span id="speech-note">端末によって発音に遅れがあります。</span></div></main><script>
'use strict';
const words=['I','know','how','to','use','these products'];
const rounds=[{ids:[2,3,4],beat:1250},{ids:[2,3,4],beat:1250},{ids:[2,3,4,5],beat:700},{ids:[2,3,4,5],beat:700},{ids:[0,1,2,3,4,5],beat:550},{ids:[0,1,2,3,4,5],beat:550}];
const $=s=>document.querySelector(s),arena=$('#arena'),overlay=$('#overlay');let nextTimer=0,lastBeat=null;let lanes=[],pads=[],roundIndex=0,notes=[],active=false,paused=false,startTime=0,pauseTime=0,frame=0,hits=0,attempts=0,roundHits=0,audio=null,voice=null,speechTimer=0,speechResolve=null,epoch=0;const travel=2000,windowMs=420;
const synth='speechSynthesis'in window?window.speechSynthesis:null;
function loadVoice(){if(synth){const list=synth.getVoices();voice=list.find(v=>v.lang==='en-US')||list.find(v=>v.lang.startsWith('en'))||null;}}loadVoice();if(synth)synth.addEventListener('voiceschanged',loadVoice);else $('#speech-note').textContent='このブラウザは読み上げ非対応です。タップ音で遊べます。';
function cancelSpeech(){clearTimeout(speechTimer);if(synth)synth.cancel();if(speechResolve){const r=speechResolve;speechResolve=null;r();}}
function speak(text,rate=0.85){cancelSpeech();if(!synth)return Promise.resolve();return new Promise(resolve=>{speechResolve=resolve;const u=new SpeechSynthesisUtterance(text==='I'?'eye':text);u.lang='en-US';if(voice)u.voice=voice;u.rate=rate;const done=()=>{if(speechResolve===resolve){clearTimeout(speechTimer);speechResolve=null;resolve();}};u.onend=done;u.onerror=done;speechTimer=setTimeout(done,Math.max(5000,text.length*170));synth.speak(u);});}
function unlock(){try{if(!audio)audio=new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch{}}
function beatTone(accent=false){if(!audio||!$('#metronome').checked)return;const o=audio.createOscillator(),g=audio.createGain();o.type='square';o.frequency.value=accent?1800:1200;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(accent?.16:.09,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.055);o.start();o.stop(audio.currentTime+.06);}
function tone(){if(!audio)return;const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=700;o.connect(g);g.connect(audio.destination);g.gain.setValueAtTime(.12,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.start();o.stop(audio.currentTime+.1);}
words.forEach((word,i)=>{const lane=document.createElement('div');lane.className='lane';const runway=document.createElement('div');runway.className='runway';const b=document.createElement('button');b.className='pad';b.innerHTML=word+'<small>'+['私は','知っています','方法','〜する','使う','これらの製品'][i]+'</small>';b.setAttribute('aria-label',word);b.onpointerdown=e=>{e.preventDefault();tap(i);};b.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();tap(i);}};lane.append(runway,b);arena.insertBefore(lane,overlay);lanes.push(lane);pads.push(b);});
function paintRound(){const r=rounds[roundIndex];$('#sentence').innerHTML=words.map((w,i)=>'<span class="'+(r.ids.includes(i)?'on':'')+'">'+w+'</span>').join(' ')+'.';lanes.forEach((l,i)=>{l.classList.toggle('inactive',!r.ids.includes(i));pads[i].disabled=!active||paused||!r.ids.includes(i);});$('#round').textContent=`${roundIndex+1} / 6回目 · ${roundIndex<2?'ゆっくり３語':roundIndex<4?'these productsを追加':'全文に挑戦'}`;$('#score').textContent=`成功 ${hits} / ${attempts}`;}
function display(title,message,label,fn){$('#title').textContent=title;$('#message').textContent=message;$('#go').textContent=label;$('#go').onclick=fn;overlay.hidden=false;}
function begin(){clearTimeout(nextTimer);lastBeat=null;epoch++;cancelSpeech();unlock();overlay.hidden=true;active=true;paused=false;roundHits=0;$('#mode').disabled=true;$('#listen').disabled=true;$('#pause').disabled=false;$('#pause').textContent='一時停止';notes.forEach(n=>n.el.remove());notes=[];rounds[roundIndex].ids.forEach((lane,i)=>{const el=document.createElement('div');el.className='ball';lanes[lane].firstChild.append(el);notes.push({lane,at:travel+500+i*rounds[roundIndex].beat,done:false,el});});startTime=performance.now();$('#status').textContent='玉が線に来たらタップ！';paintRound();cancelAnimationFrame(frame);frame=requestAnimationFrame(tick);}
function tick(now){if(!active||paused)return;const elapsed=now-startTime;const beat=Math.floor((elapsed-(travel+500))/(rounds[roundIndex].beat/2));if(beat!==lastBeat){lastBeat=beat;beatTone(beat%2===0);}notes.forEach(n=>{if(n.done)return;const h=lanes[n.lane].firstChild.clientHeight,target=h-17;const y=target*(elapsed-(n.at-travel))/travel;n.el.style.transform=`translateY(${y-11.5}px)`;n.el.style.visibility=y<0?'hidden':'visible';if(elapsed>n.at+windowMs){n.done=true;n.el.remove();attempts++;$('#status').textContent='次の玉に合わせよう';paintRound();}});if(notes.every(n=>n.done)&&elapsed>notes.at(-1).at+1000){complete();return;}frame=requestAnimationFrame(tick);}
function tap(i){if(!active||paused||!rounds[roundIndex].ids.includes(i))return;
 if($('#mode').value==='tap')speak(words[i],roundIndex<2?.75:roundIndex<4?1.2:1.45);else tone();
 pads[i].classList.add('flash');setTimeout(()=>pads[i].classList.remove('flash'),180);
 const elapsed=performance.now()-startTime,n=notes.find(n=>!n.done&&n.lane===i&&Math.abs(n.at-elapsed)<=windowMs);
 if(!n){$('#status').textContent='♪ 発音！ 次は線に合わせよう';return;}
 n.done=true;n.el.remove();hits++;attempts++;roundHits++;$('#status').textContent='♪ いいリズム！';paintRound();}

async function complete(){active=false;$('#pause').disabled=true;paintRound();const token=epoch;$('#status').textContent='このまとまりを聞こう';if($('#mode').value==='phrase')await speak(rounds[roundIndex].ids.map(i=>words[i]).join(' '),roundIndex<2?.75:roundIndex<4?1.2:1.45);if(token!==epoch)return;$('#mode').disabled=false;$('#listen').disabled=false;
 if(roundIndex===5){display('６回、おつかれさま！',`成功 ${hits} / ${attempts}。how to use から全文まで練習しました。`,'もう一度 ▶',restart);$('#status').textContent='練習完了';}
 else{$('#status').textContent=roundIndex===1?'次は these products も！':roundIndex===3?'次は I know から全文！':'もう一度、同じリズムで！';nextTimer=setTimeout(()=>{if(token!==epoch)return;roundIndex++;begin();},1100);}}
function restart(){clearTimeout(nextTimer);epoch++;cancelAnimationFrame(frame);cancelSpeech();roundIndex=0;hits=0;attempts=0;begin();}
$('#pause').onclick=()=>{if(!active)return;if(!paused){paused=true;pauseTime=performance.now();cancelAnimationFrame(frame);cancelSpeech();$('#pause').textContent='再開';$('#status').textContent='一時停止中';}else{startTime+=performance.now()-pauseTime;paused=false;$('#pause').textContent='一時停止';$('#status').textContent='続きから';frame=requestAnimationFrame(tick);}paintRound();};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&active&&!paused)$('#pause').click();});
$('#listen').onclick=()=>{unlock();speak(rounds[roundIndex].ids.map(i=>words[i]).join(' '),roundIndex<2?.75:roundIndex<4?1.2:1.45);};$('#reset').onclick=restart;$('#go').onclick=begin;paintRound();
</script></html>
