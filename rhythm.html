function setupLesson(index){currentAttempt=null;$("#hub").hidden=true;$("#game").hidden=false;$("#lesson-select").value=String(index);clearTimeout(nextTimer);epoch++;cancelAnimationFrame(frame);cancelSpeech();active=false;paused=false;phase='rhythm';lessonIndex=index;lesson=lessons[index];words=lesson.words;wordBeats=lesson.beats;
 const all=words.map((_,i)=>i);rounds=[{ids:lesson.part,beat:1250,rate:.75},{ids:lesson.part,beat:1250,rate:.75},{ids:all,beat:700,rate:1.2},{ids:all,beat:550,rate:1.45}];

 words.forEach((word,i)=>{const lane=document.createElement('div');lane.className='lane';const runway=document.createElement('div');runway.className='runway';const b=document.createElement('button');b.className='pad';b.textContent=word;b.setAttribute('aria-label',word);b.onpointerdown=e=>{e.preventDefault();tap(i);};b.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();tap(i);}};lane.append(runway,b);arena.insertBefore(lane,overlay);lanes.push(lane);pads.push(b);});
 $('#finish-panel').hidden=true;arena.hidden=false;$('#listen').hidden=false;$('#listen').disabled=false;$('#mode').disabled=false;$('#pause').disabled=true;$('#pause').textContent='一時停止';paintRound();$('#status').textContent='準備できたらスタート';display('まとまりから、全文へ',lesson.three?'how → to → use を２回。these productsを加えて２回。最後に全文を２回！':lesson.part.map(i=>words[i]).join(' → ')+' を２回。その後、全文を２回練習して並び替えに挑戦！','スタート ▶',begin);
}

function paintRound(){const r=rounds[roundIndex];$('#sentence').innerHTML=words.map((w,i)=>'<span class="'+(r.ids.includes(i)?'on':'')+'">'+w+(lesson.commaAfter===i?',':'')+'</span>').join(' ')+lesson.end;lanes.forEach((l,i)=>{l.classList.toggle('inactive',!r.ids.includes(i));pads[i].disabled=!active||paused||!r.ids.includes(i);});$('#round').textContent=`${randomMode?'ランダム '+(randomDone+1)+'/5 · ':''}${roundIndex+1} / ${rounds.length}回目 · ${roundIndex<2?'まとまりを練習':lesson.three&&roundIndex<4?'these productsを追加':'全文に挑戦'}`;$('#score').textContent=`${points}点`;$('#combo').textContent=`${combo} COMBO · BEST ${maxCombo}`;}

function begin(){clearTimeout(nextTimer);epoch++;cancelSpeech();unlock();overlay.hidden=true;active=true;paused=false;roundHits=0;$('#mode').disabled=true;$('#listen').disabled=true;$('#pause').disabled=false;$('#pause').textContent='一時停止';notes.forEach(n=>n.el.remove());notes=[];rhythmNotes(rounds[roundIndex]).forEach(note=>{const el=document.createElement('div');el.className='ball';lanes[note.lane].firstChild.append(el);notes.push({...note,done:false,el});});startTime=performance.now();$('#status').textContent='玉が線に来たらタップ！';paintRound();cancelAnimationFrame(frame);frame=requestAnimationFrame(tick);}
function tick(now){if(!active||paused)return;const elapsed=now-startTime;notes.forEach(n=>{if(n.done)return;const h=lanes[n.lane].firstChild.clientHeight,target=h-17;const y=target*(elapsed-(n.at-travel))/travel;n.el.style.transform=`translateY(${y-11.5}px)`;n.el.style.visibility=y<0?'hidden':'visible';if(elapsed>n.at+windowMs){n.done=true;n.el.remove();attempts++;combo=0;$('#status').textContent='次の玉から、もう一度！';paintRound();}});if(notes.every(n=>n.done)&&elapsed>notes.at(-1).at+Math.max(1000,notes.at(-1).hold)){complete();return;}frame=requestAnimationFrame(tick);}
function tap(i){if(!active||paused||!rounds[roundIndex].ids.includes(i))return;
 if($('#mode').value==='tap')speak(words[i],rounds[roundIndex].rate);else tone();

 if(!n){$('#status').textContent='♪ 発音！ 次は線に合わせよう';return;}
 n.done=true;n.el.remove();hits++;attempts++;roundHits++;const perfect=Math.abs(n.at-elapsed)<=140;points+=perfect?100:50;perfect?perfects++:goods++;combo++;maxCombo=Math.max(maxCombo,combo);$('#status').textContent=perfect?'PERFECT！ +100':'GOOD！ +50';const burst=document.createElement('span');burst.className='burst';lanes[i].firstChild.append(burst);setTimeout(()=>burst.remove(),500);if(perfect){pads[i].classList.add('perfect');setTimeout(()=>pads[i].classList.remove('perfect'),250);}paintRound();$('#combo').classList.remove('combo-pop');void $('#combo').offsetWidth;$('#combo').classList.add('combo-pop');}

async function complete(){active=false;$('#pause').disabled=true;paintRound();const token=epoch;$('#status').textContent='このまとまりを聞こう';if($('#mode').value==='phrase')await speak(rounds[roundIndex].ids.map(i=>words[i]).join(' '),rounds[roundIndex].rate);if(token!==epoch)return;$('#mode').disabled=false;$('#listen').disabled=false;
 if(roundIndex===rounds.length-1){$('#status').textContent='ラスト！ 今度は自分で英文を作ろう';nextTimer=setTimeout(()=>{if(token===epoch)startFinish();},1200);}
 else{$('#status').textContent=rounds[roundIndex+1].ids.length>rounds[roundIndex].ids.length?'次は練習する範囲が広がります！':'もう一度、同じまとまり！';nextTimer=setTimeout(()=>{if(token!==epoch)return;roundIndex++;begin();},1100);}}
function restart(){currentAttempt=null;clearTimeout(nextTimer);epoch++;cancelAnimationFrame(frame);cancelSpeech();roundIndex=0;hits=0;attempts=0;points=0;combo=0;maxCombo=0;perfects=0;goods=0;phase="rhythm";$("#finish-panel").hidden=true;arena.hidden=false;$("#listen").hidden=false;$("#mode").disabled=false;begin();}

function startFinish(){cancelSpeech();phase='finish';active=false;paused=false;arena.hidden=true;$('#finish-panel').hidden=false;$('#listen').hidden=true;$('#mode').disabled=true;$('#pause').disabled=true;$('#sentence').textContent=lesson.meaning;$('#round').textContent='仕上げ · 並び替え';$('#status').textContent='順番に押して英文を作ろう';build=[];checks=0;usedHint=false;solved=false;bank=words.map((_,i)=>i);for(let i=bank.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bank[i],bank[j]]=[bank[j],bank[i]];}if(bank.every((id,i)=>id===i))bank.reverse();renderFinish();}
function renderFinish(message=''){
 $('#finish-panel').innerHTML=`<h2>ラスト！ 自分で英文を作ろう</h2><p>押すと発音し、上に入ります。戻すときは上の語句をタップ。最後に答え合わせをします。</p><div class="build-line">${build.length?build.map((id,i)=>`<button data-remove="${i}" ${solved?'disabled':''}>${words[id]}</button>${lesson.commaAfter===i?'<span>,</span>':''}`).join(''):'ここに英文を作ろう'}${build.length===words.length?'<span>'+lesson.end+'</span>':''}</div><div class="build-bank">${bank.map(id=>`<button data-add="${id}" ${build.includes(id)||solved?'disabled':''}>${words[id]}</button>`).join('')}</div><div class="finish-actions"><button class="go" id="build-check" ${build.length!==words.length||solved?'disabled':''}>答え合わせ</button><button id="build-hint" ${solved?'disabled':''}>お手本を聞く</button></div><div class="finish-message" role="status">${message}</div>`;
 $('#finish-panel').querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>addBuild(Number(b.dataset.add)));

function addBuild(id){if(solved||build.includes(id))return;build.push(id);unlock();speak(words[id],1.2);renderFinish();}
function checkBuild(){if(solved||build.length!==words.length)return;checks++;const correct=build.every((id,i)=>id===i);if(checks===1)recordFirst(correct);if(!correct){renderFinish('もう一度考えてみよう。上の語句を戻して並べ直せます。「お手本を聞く」も使えます。');return;}
 solved=true;const bonus=checks===1&&!usedHint?300:0;points+=bonus;recordClear();let best=points,saved=true;try{best=Math.max(points,Number(localStorage.getItem('english-rhythm-lesson-v2-'+lesson.id))||0);localStorage.setItem('english-rhythm-lesson-v2-'+lesson.id,String(best));}catch{saved=false;}
 renderFinish(`<strong>クリア！ 英文が完成しました。</strong><p>${bonus?'初回・ヒントなし正解！ +300点':'並べ直しても、最後までできたらクリア！'}</p><div class="finish-score">${points}点</div><p>PERFECT ${perfects}回 ／ GOOD ${goods}回<br>最大 ${maxCombo} COMBO${saved?'<br>自己ベスト '+best+'点':''}</p><button id="full-listen">完成文を聞く</button> <button class="go" id="play-again">もう一度挑戦</button> <button id="next-lesson">${randomMode&&!randomQueue.length?'５文の記録を見る':'次の文へ →'}</button>`);
 $('#score').textContent=`${points}点`;$('#status').textContent='クリア！';$('#full-listen').onclick=()=>speak(lessonText(lesson),1.2);$('#play-again').onclick=restart;$('#next-lesson').onclick=()=>{nextLesson();};speak(lessonText(lesson),1.2);

const RECORD_KEY='english-rhythm-records-v1';let records={start:'2026-10-19',runs:[],legacy:{}},recordStorageOK=true,currentAttempt=null,randomQueue=[],randomMode=false,randomDone=0,calMonth='',calDay='';
function dayKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function validDay(d){return typeof d==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(d)&&!isNaN(new Date(d+'T12:00:00'))&&dayKey(new Date(d+'T12:00:00'))===d;}
function initRecords(){try{const raw=JSON.parse(localStorage.getItem(RECORD_KEY)||'null');if(raw&&typeof raw==='object'){if(validDay(raw.start))records.start=raw.start;if(Array.isArray(raw.runs))records.runs=raw.runs.filter(r=>r&&validDay(r.day)&&lessons.some(l=>l.id===r.lessonId)&&typeof r.ok==='boolean'&&Number.isFinite(r.score)&&r.score>=0);if(raw.legacy&&typeof raw.legacy==='object')records.legacy=raw.legacy;}
 for(const l of lessons){const best=Number(localStorage.getItem('english-rhythm-lesson-v2-'+l.id));if(Number.isFinite(best)&&best>0)records.legacy[l.id]=Math.max(Number(records.legacy[l.id])||0,best);}
 const old=Number(localStorage.getItem('english-rhythm-best-v1'));if(old>0&&Number.isFinite(old))records.legacy[11]=Math.max(Number(records.legacy[11])||0,old);
 }catch{recordStorageOK=false;}}
function saveRecords(){try{localStorage.setItem(RECORD_KEY,JSON.stringify(records));}catch{recordStorageOK=false;}}
function recordFirst(ok){if(currentAttempt)return;currentAttempt={lessonId:lesson.id,day:dayKey(),ok,score:points,cleared:false,combo:maxCombo,perfects,goods,hint:usedHint};records.runs.push(currentAttempt);saveRecords();}
function recordClear(){if(!currentAttempt)return;Object.assign(currentAttempt,{score:points,cleared:true,combo:maxCombo,perfects,goods});saveRecords();}
function firstDaily(){const map=new Map();for(const r of records.runs){const key=r.day+'-'+r.lessonId;if(!map.has(key))map.set(key,r);}return [...map.values()].sort((a,b)=>a.day.localeCompare(b.day));}
function histFor(id){return firstDaily().filter(r=>r.lessonId===id).slice(-2);}
function bestFor(id){return Math.max(0,Number(records.legacy[id])||0,...records.runs.filter(r=>r.lessonId===id&&r.cleared).map(r=>r.score));}
function symbols(id){const h=histFor(id);return [...Array(2-h.length).fill(null),...h].map(r=>r?`<span class="${r.ok?'yes':'no'}">${r.ok?'○':'×'}</span>`:'<span class="muted">・</span>').join('');}
function stopPractice(){clearTimeout(nextTimer);epoch++;cancelAnimationFrame(frame);cancelSpeech();active=false;paused=false;currentAttempt=null;}
function warnStorage(){return recordStorageOK?'':'<p class="storage-warning">記録を保存できません。この画面を閉じると失われる場合があります。</p>';}
function showHub(){stopPractice();randomQueue=[];randomMode=false;randomDone=0;$('#game').hidden=true;$('#hub').hidden=false;const today=dayKey(),daily=firstDaily().filter(r=>r.day>=records.start&&r.day<=today),todays=daily.filter(r=>r.day===today),cleared=new Set(records.runs.filter(r=>r.cleared).map(r=>r.lessonId)).size;
 $('#hub').innerHTML=`<p class="hub-lead">ENGLISH RHYTHM · ${lessons.length} SENTENCES</p><h1>英語リズム</h1><p class="hub-lead">聞いて、押して、英文を作ろう。<br>好きな文を選んでも、ランダム５文でも。</p><div class="hub-actions"><button class="go" id="random-start">ランダム５文 ▶</button><button id="open-calendar">学習カレンダー・記録</button></div><div class="hub-card hub-stats"><div><b>${todays.length}</b>今日の文数</div><div><b>${cleared} / ${lessons.length}</b>クリアした文</div><div><b>${daily.length?Math.round(daily.filter(r=>r.ok).length/daily.length*100)+'％':'—'}</b>初回正解率</div></div><h2>文を選ぶ</h2><p class="hub-note">○×は並び替えの最初の答え。左：前回 → 右：最新<br>同じ文は１日１回分。右端はクリア時の最高点です。</p><div class="lesson-table">${lessons.map((l,i)=>`<button class="lesson-row" data-lesson="${i}"><b>${String(i+1).padStart(2,'0')}</b><span>${l.title}<small>${lessonText(l)}<br>${l.three?'３段階・６回':'２段階・４回'}</small></span><span class="history">${symbols(l.id)}</span><span>${bestFor(l.id)||'—'}<small>最高点</small></span></button>`).join('')}</div><h2>最近の得点</h2>${scoreRows(records.runs.filter(r=>r.cleared).slice(-5).reverse())}<details><summary>記録の数え方</summary><p class="hub-note">並び替えの最初の答え合わせで○×を記録します。解き直しても最初の×は残ります。同じ日の同じ文はカレンダー・正解率では１文と数えます。得点はクリアするたびに保存します。途中でタイトルへ戻ると練習は終了します。<br>保存先はこの端末のブラウザです。別端末とは同期しません。以前の最高点は引き継ぎますが、日付のない過去の点数はカレンダーには入りません。文によって練習回数・満点が異なります。</p></details>${warnStorage()}`;
 $('#random-start').onclick=startRandom;$('#open-calendar').onclick=()=>{calMonth=today.slice(0,7);calDay=today;showCalendar();};$('#hub').querySelectorAll('[data-lesson]').forEach(b=>b.onclick=()=>{randomMode=false;setupLesson(Number(b.dataset.lesson));});window.scrollTo(0,0);
}
function scoreRows(rows){return rows.length?rows.map(r=>{const l=lessons.find(l=>l.id===r.lessonId);return `<div class="record-item">${r.day} · ${l.title}<br><strong>${r.score}点</strong> ／ 最大${r.combo||0}コンボ ／ 並び替え初回 <span class="${r.ok?'yes':'no'}">${r.ok?'○':'×'}</span>${r.cleared?'':'（解き直し中に終了）'}</div>`;}).join(''):'<p class="hub-note">まだ記録がありません。</p>';}
function startRandom(){randomMode=true;randomDone=0;randomQueue=lessons.map((_,i)=>i);for(let i=randomQueue.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[randomQueue[i],randomQueue[j]]=[randomQueue[j],randomQueue[i]];}randomQueue=randomQueue.slice(0,5);setupLesson(randomQueue.shift());}
function nextLesson(){if(randomMode){randomDone++;if(randomQueue.length){setupLesson(randomQueue.shift());return;}showHub();$('#hub').insertAdjacentHTML('afterbegin','<div class="hub-card"><strong>ランダム５文、おつかれさま！</strong><p class="hub-note">記録は下の表・カレンダーで確認できます。</p></div>');return;}setupLesson((lessonIndex+1)%lessons.length);}
function monthSummary(month,today){const start=[month+'-01',records.start].sort().at(-1),d=new Date(Number(month.slice(0,4)),Number(month.slice(5)),0),end=[dayKey(d),today].sort()[0];const days=Math.max(0,Math.round((Date.parse(end+'T00:00:00Z')-Date.parse(start+'T00:00:00Z'))/86400000)+1);const rows=firstDaily().filter(r=>r.day>=start&&r.day<=end);return {days,rows,start,end,average:days?(rows.length/days).toFixed(1):'—'};}
function showCalendar(){const today=dayKey(),sum=monthSummary(calMonth,today),offset=new Date(calMonth+'-01T12:00:00').getDay(),last=new Date(Number(calMonth.slice(0,4)),Number(calMonth.slice(5)),0).getDate();let cells='<span></span>'.repeat(offset);const daily=firstDaily();for(let n=1;n<=last;n++){const d=calMonth+'-'+String(n).padStart(2,'0'),out=d<records.start||d>today,count=daily.filter(r=>r.day===d).length;cells+=`<button class="cal-day ${out?'out':count>=5?'dark':count>=3?'medium':count?'light':''} ${d===calDay?'chosen':''}" data-date="${d}" aria-label="${d} ${out?'集計対象外':count+'文'}"><strong>${n}</strong><small>${out?'—':count+'文'}</small></button>`;}
 const rows=daily.filter(r=>r.day===calDay),eligible=calDay>=records.start&&calDay<=today;
 $('#hub').innerHTML=`<button id="calendar-back">← タイトル</button><h1>学習カレンダー</h1><div class="month-nav"><button id="month-prev" aria-label="前の月">‹</button><h2>${calMonth.replace('-','年')}月</h2><button id="month-next" aria-label="次の月" ${calMonth>=today.slice(0,7)?'disabled':''}>›</button></div><div class="week">${['日','月','火','水','木','金','土'].map(x=>'<span>'+x+'</span>').join('')}</div><div class="calendar-grid">${cells}</div><p class="hub-note">灰：0文　薄緑：1〜2文　緑：3〜4文　濃緑：5文以上</p><div class="hub-card"><h2>${calDay}</h2>${eligible?`<p>${rows.length}文 ／ 初回正解 ${rows.filter(r=>r.ok).length}文</p>${scoreRows(records.runs.filter(r=>r.day===calDay).slice().reverse())}`:'<p>集計対象外の日です。</p>'}</div><div class="hub-card"><h2>この月の記録</h2><div class="hub-stats"><div><b>${sum.rows.length}</b>文数</div><div><b>${sum.average}</b>１日平均</div><div><b>${sum.rows.length?Math.round(sum.rows.filter(r=>r.ok).length/sum.rows.length*100)+'％':'—'}</b>初回正解率</div></div><p class="hub-note">${sum.days?sum.start+'〜'+sum.end+'の'+sum.days+'日間（未学習日を含む）':'対象期間がありません。'}</p></div><details><summary>使用開始日の設定</summary><label>開始日<input class="date-input" id="start-date" type="date" value="${records.start}" min="2000-01-01" max="${today}"></label><button id="save-start">保存</button><p id="date-message" role="status"></p><p class="hub-note">初期値は2026年10月19日。変更しても記録は削除されません。過去の○×・学習日は追加した日から記録します。</p></details>${warnStorage()}`;
 $('#calendar-back').onclick=showHub;$('#month-prev').onclick=()=>moveMonth(-1);$('#month-next').onclick=()=>moveMonth(1);$('#hub').querySelectorAll('[data-date]').forEach(b=>b.onclick=()=>{calDay=b.dataset.date;showCalendar();});$('#save-start').onclick=()=>{const d=$('#start-date').value;if(!validDay(d)||d<'2000-01-01'||d>today){$('#date-message').textContent='今日以前の有効な日付を選んでください。';return;}records.start=d;saveRecords();showCalendar();$('#hub').querySelector('details').open=true;$('#date-message').textContent=recordStorageOK?'保存しました。':'保存できませんでした。';};
}
function moveMonth(n){const d=new Date(calMonth+'-01T12:00:00');d.setMonth(d.getMonth()+n);calMonth=dayKey(d).slice(0,7);calDay=calMonth===dayKey().slice(0,7)?dayKey():calMonth+'-01';showCalendar();}

$('#pause').onclick=()=>{if(!active)return;if(!paused){paused=true;pauseTime=performance.now();cancelAnimationFrame(frame);cancelSpeech();$('#pause').textContent='再開';$('#status').textContent='一時停止中';}else{startTime+=performance.now()-pauseTime;paused=false;$('#pause').textContent='一時停止';$('#status').textContent='続きから';frame=requestAnimationFrame(tick);}paintRound();};

$('#listen').onclick=()=>{unlock();speak(rounds[roundIndex].ids.map(i=>words[i]).join(' '),rounds[roundIndex].rate);};$('#reset').onclick=restart;$('#lesson-select').innerHTML=lessons.map((l,i)=>`<option value="${i}">${i+1}. ${l.title} · ${lessonText(l)}</option>`).join('');$('#lesson-select').onchange=()=>{randomQueue=[];randomMode=false;setupLesson(Number($('#lesson-select').value));};$('#back-title').onclick=showHub;initRecords();showHub();
