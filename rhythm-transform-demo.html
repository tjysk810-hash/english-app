.judgment{position:absolute;z-index:4;pointer-events:none;transform:translate(-50%,-50%);font-size:13px;font-weight:900;letter-spacing:.04em;background:#ffffffee;border:1px solid currentColor;border-radius:14px;padding:4px 8px;white-space:nowrap;animation:judgeFade .7s ease-out forwards}.judgment.perfect{color:#a65c00}.judgment.great{color:#087769}.judgment.good{color:#2366a1}@keyframes judgeFade{0%,40%{opacity:1}100%{opacity:0;transform:translate(-50%,-100%)}} .play-options .primary small{color:#e6ffff}.round-notice{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);z-index:4;background:#fffef0;color:#175563;padding:8px 16px;border-radius:18px;border:1px solid #8fbcc9;font-weight:800;pointer-events:none;white-space:nowrap} </style><main><div class="eyebrow">ENGLISH RHYTHM / PROTOTYPE</div><section id="home"><h1>見抜いて、打ち返す。</h1><p class="muted">英文変形チャレンジ · ランダム配置 / 最大８か所</p><div class="panel"><h2>基本文を変えてみよう</h2><label>問題 <select id="lesson"></select></label><label>スピード <select id="speed"><option value="1">通常</option><option value="1.5" selected>高速 1.5倍</option><option value="1.75">超高速 1.75倍</option></select></label><label><input id="sound" type="checkbox" checked> 効果音と英文の読み上げ</label><p class="muted">全文を２回 → 並び替え</p><div class="options play-options"><button class="primary" data-kind="double">ダミー同時発射で遊ぶ ▶<small>隣り合う２つの玉から、正しい語を選ぼう。</small></button><button data-kind="bottom">下の２択で遊ぶ ▶<small>２択だけ下に固定。他の語句はランダム。</small></button></div></div><div class="panel muted">カウントは最初だけ。玉が着くまでに語を選んでバリアを張ります。２択は一度だけ選択できます。連続正解でコンボ加点。最後の並び替えは、速く完成するほど高得点。</div><button id="audio-test" class="wide">音を確認：発射 → 反射 → 命中 → 英語</button><p id="audio-note" class="muted" role="status">端末の音量を上げて確認できます。</p></section>
<section id="game" hidden><div class="row between"><button id="quit">← やめる</button><span id="score">0点</span><button id="pause">一時停止</button></div><div class="panel"><div class="muted">基本文</div><div class="source" id="source"></div><div class="task" id="task"></div></div><div class="row between stats"><span id="stage"></span><span id="combo"></span></div><div class="progress"><i id="progress"></i></div><div class="board" id="board"><div id="round-notice" class="round-notice" hidden>２周目</div><div class="core" id="core"></div><div class="overlay" id="overlay" hidden></div></div><div id="feedback" class="feedback" aria-live="polite"></div><p class="muted">中央なら PERFECT。リングの端や少し通り過ぎても GOOD。先押しバリアも使えます。</p></section>
<section id="finish" hidden><h1>最後は、自分で組み立てる。</h1><div class="panel"><div class="muted" id="finalSource"></div><p class="task" id="finalTask"></p><p id="finalTimer" class="task" aria-live="off"></p><div id="answer" class="chips"></div><div id="bank" class="chips"></div><button id="check" class="primary wide">答え合わせ</button><p id="finalFeedback" aria-live="polite"></p><div class="row"><button id="listen">完成文を聞く</button><button id="retry">もう一度遊ぶ</button><button id="back">問題を選ぶ</button></div></div><div class="panel" id="summary"></div></section></main><script>
'use strict';
const $=s=>document.querySelector(s), lessons=[
{title:'三人称単数 → 疑問文',source:'He plays tennis after school.',task:'「彼は放課後テニスをしますか」',words:['Does','he','play','tennis','after school'],wrong:{0:'Do',2:'plays'},focus:[0,1,2],tip:'主語が he なので Does。Does のあとは play。',sentence:'Does he play tennis after school?'},
{title:'三人称単数 → 否定文',source:'She likes music.',task:'「彼女は音楽が好きではありません」',words:['She','does','not','like','music'],wrong:{1:'do',3:'likes'},focus:[1,2,3],tip:'She does not のあとには原形の like。',sentence:'She does not like music.'},
{title:'現在 → 過去',source:'He plays tennis on Sundays.',task:'「彼は先週の日曜日にテニスをしました」',words:['He','played','tennis','last Sunday'],wrong:{1:'plays',3:'next Sunday'},focus:[0,1],tip:'過去は played。「先週の日曜日」は last Sunday。',sentence:'He played tennis last Sunday.'},
{title:'will で未来の文',source:'She practices tennis after school.',task:'willを使って「彼女は明日、放課後テニスを練習します」',words:['She','will','practice','tennis','after','school','tomorrow'],wrong:{2:'practices'},focus:[0,1,2],tip:'will のあとには原形の practice。',sentence:'She will practice tennis after school tomorrow.'},
{title:'過去 → 疑問文',source:'He played tennis yesterday.',task:'「彼は昨日テニスをしましたか」',words:['Did','he','play','tennis','yesterday'],wrong:{0:'Does',2:'played'},focus:[0,1,2],tip:'過去を尋ねるのは Did。Did のあとは play。',sentence:'Did he play tennis yesterday?'}];
lessons.forEach((l,i)=>$('#lesson').add(new Option(l.title,i)));let kind='double',state='home',L,rate,rounds,roundIndex,steps,stepIndex,layout=[],active=null,score=0,combo=0,errors=0,timeouts=0,hits=0,total=0,done=0,elapsed=0,last=0,paused=false,raf=0,phase='',until=0,audio,selected=[],bank=[],firstCheck=null,spareSlot=0,beatIndex=-1,rhythmOrigin=0,wordOrder=[],bottomCenter={x:50,y:80},maxCombo=0,comboBonusTotal=0,finalStart=0,finalElapsed=0,finalBonus=0,finalFrame=0;
const shuffle=a=>{const out=a.slice();for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out};let slots=[];
function polygon(n){const w=$('#board').clientWidth||362,h=$('#board').clientHeight||420,r=Math.min(w*.34,h*.34);return Array.from({length:n},(_,i)=>{const a=Math.PI/2+i*2*Math.PI/n;return {x:50+Math.cos(a)*r/w*100,y:46+Math.sin(a)*r/h*100}})}
function createProblemLayout(){
 const hasChoices=Object.keys(L.wrong).length>0;
 slots=polygon(L.words.length+(hasChoices?1:0));
 const ids=[];
 if(kind==='double'&&hasChoices){
  spareSlot=Math.floor(Math.random()*slots.length);
  const pairs=shuffle(Object.keys(L.wrong).map(Number));
  const neighbors=shuffle([(spareSlot+slots.length-1)%slots.length,(spareSlot+1)%slots.length]);
  pairs.forEach((id,i)=>ids[id]=neighbors[i]);
  const available=shuffle(slots.map((_,i)=>i).filter(i=>i!==spareSlot&&!ids.includes(i)));
  L.words.forEach((_,i)=>{if(ids[i]===undefined)ids[i]=available.pop()});
 }else{
  spareSlot=0;
  const available=shuffle(slots.map((_,i)=>i).filter(i=>!hasChoices||i!==spareSlot));
  L.words.forEach((_,i)=>ids[i]=available.pop());
 }
 layout=L.words.map((text,id)=>({...slots[ids[id]],text,id,slot:ids[id]}));
 bottomCenter=slots[0];
}
function layoutStep(){renderTargets();}

function sound(type='bounce'){if(!$('#sound').checked)return;type=type===true?'error':type===false?'bounce':type;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const spec={beat:[95,48,.09,.055,'sine'],launch:[430,850,.1,.09,'triangle'],bounce:[980,330,.16,.15,'triangle'],impact:[180,45,.24,.19,'sine'],error:[160,38,.22,.12,'sawtooth']}[type];const o=audio.createOscillator(),g=audio.createGain();o.connect(g);g.connect(audio.destination);o.type=spec[4];o.frequency.setValueAtTime(spec[0],audio.currentTime);o.frequency.exponentialRampToValueAtTime(spec[1],audio.currentTime+spec[2]);g.gain.setValueAtTime(spec[3],audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+spec[2]);o.start();o.stop(audio.currentTime+spec[2]+.02)}catch{$('#audio-note').textContent='効果音を開始できませんでした。ブラウザの音声設定をご確認ください。'}}
function say(text){if(!$('#sound').checked||!window.speechSynthesis)return;window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=.95;u.volume=1;const voice=window.speechSynthesis.getVoices().find(v=>v.lang.startsWith('en'));if(voice)u.voice=voice;window.speechSynthesis.speak(u)}
function speak(){say(L.sentence)}
function pulse(){const beat=600/rate;const n=Math.floor((elapsed-rhythmOrigin)/beat);if(n!==beatIndex){beatIndex=n;sound('beat')}const p=((elapsed-rhythmOrigin)%beat+beat)%beat/beat;const scale=1+.14*Math.exp(-p*10);$('#core').style.transform=`translate(-50%,-50%) scale(${scale})`;}
function waitForBeat(){phase='gap';until=rhythmOrigin+(Math.floor((elapsed-rhythmOrigin)/(600/rate))+1)*(600/rate)}
$('#audio-test').onclick=()=>{$('#sound').checked=true;sound('launch');setTimeout(()=>sound('bounce'),350);setTimeout(()=>sound('impact'),700);setTimeout(()=>say('Does he play tennis?'),1050);$('#audio-note').textContent='発射・反射・命中の３つの音と英文が聞こえるか確認してください。'};
function show(id){['home','game','finish'].forEach(x=>$('#'+x).hidden=x!==id)}
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{kind=b.dataset.kind;start()});
function stats(){$('#score').textContent=score+'点';$('#combo').textContent=combo+' COMBO';$('#progress').style.width=done/total*100+'%'}
function start(){cancelAnimationFrame(finalFrame);cancelAnimationFrame(raf);maxCombo=comboBonusTotal=finalBonus=0;window.speechSynthesis?.cancel();L=lessons[+$('#lesson').value];rate=+$('#speed').value;const all=L.words.map((_,i)=>i);rounds=[all,all];total=rounds.reduce((n,r)=>n+r.length,0);roundIndex=0;score=combo=errors=timeouts=hits=done=elapsed=0;paused=false;$('#pause').textContent='一時停止';state='game';show('game');window.scrollTo?.(0,0);$('#round-notice').hidden=true;$('#source').textContent=L.source;$('#task').textContent=L.task;$('#feedback').textContent='正しい語を選んでバリアを張ろう';stats();createProblemLayout();prepareRound();phase='count';until=1200/rate;rhythmOrigin=until;beatIndex=-1;$('#overlay').hidden=false;sound();last=performance.now();raf=requestAnimationFrame(tick)}
function prepareRound(){steps=rounds[roundIndex];stepIndex=0;$('#board').querySelectorAll('.target,.orb,.blast,.shared-ring,.judgment').forEach(e=>e.remove());layoutStep();$('#stage').textContent='全文 · '+(roundIndex+1)+' / '+rounds.length+' 周目';renderTargets();}
function addTarget(item,choice=null){const b=document.createElement('button');b.className='target';b.style.left=item.x+'%';b.style.top=item.y+'%';b.innerHTML='<span class="ring"></span><span class="word"></span>';b.querySelector('.word').textContent=item.text;b.setAttribute('aria-label',item.text+' を選ぶ');b.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();choose(item.id,choice)};b.onclick=e=>{if(e.detail===0)choose(item.id,choice)};$('#board').append(b);return b}
function renderTargets(){ $('#board').querySelectorAll('.target,.shared-ring').forEach(e=>e.remove());layout.forEach(item=>item.el=addTarget(item));}
function launch(){$('#round-notice').hidden=true;sound('launch');const id=steps[stepIndex],wrong=L.wrong[id];layoutStep(id);active={id,start:elapsed,duration:1800/rate,choice:null,wrong:!!wrong,orbs:[],choices:[]};if(wrong&&kind==='bottom'){layout[id].el.remove();const shared=document.createElement('span');shared.className='ring shared-ring';shared.style.cssText='position:absolute;left:50%;transform:translate(-50%,-24px);border-color:#176fc1';shared.style.top=bottomCenter.y+'%';$('#board').append(shared);const choices=shuffle([{text:L.words[id],correct:true},{text:wrong,correct:false}]);choices.forEach((c,i)=>{const item={...bottomCenter,x:bottomCenter.x+(i===0?-12:12),text:c.text,id};const el=addTarget(item,c.correct);el.querySelector('.ring').style.visibility='hidden';el.classList.add('active');active.choices.push(el)});addOrb(bottomCenter);}else{layout[id].el.classList.add('active');active.choices.push(layout[id].el);addOrb(layout[id]);if(wrong){const free=spareSlot;const item={...slots[free],text:wrong,id};const el=addTarget(item,false);el.classList.add('active');active.choices.push(el);addOrb(item);}}const target=active.orbs[0].pos;const w=$('#board').clientWidth||362,h=$('#board').clientHeight||420;active.distance=Math.hypot((target.x-50)*w/100,(target.y-46)*h/100);active.window=30/active.distance*active.duration;phase='flight';}
function addOrb(pos){const el=document.createElement('div');el.className='orb';$('#board').append(el);active.orbs.push({el,pos})}
function timingGrade(offset,duration,distance){const pixels=Math.abs(offset)/duration*distance;return pixels<=8?'PERFECT':pixels<=19?'GREAT':'GOOD'}
function showJudgment(label){const o=active.orbs[0].pos;const el=document.createElement('span');el.className='judgment '+label.toLowerCase();el.textContent=label;el.style.left=o.x+'%';el.style.top=(o.y-8)+'%';$('#board').append(el);setTimeout(()=>el.remove(),720)}
function choose(id,choice){if(state!=='game'||paused||phase!=='flight'||!active||active.choice!==null)return;const offset=elapsed-active.start-active.duration;if(offset>active.window)return;say(choice===false?L.wrong[id]:L.words[id]);if(id!==active.id){score-=30;errors++;combo=0;sound(true);$('#feedback').textContent='今、玉が向かっている語から選ぼう';stats();return}active.choice=choice!==false;active.grade=timingGrade(offset,active.duration,active.distance);if(!active.choice){score-=50;errors++;combo=0;sound(true);const pos=kind==='bottom'?bottomCenter:active.orbs.at(-1).pos;const b=document.createElement('span');b.className='blast';b.textContent='✹';b.style.left=pos.x+'%';b.style.top=pos.y+'%';$('#board').append(b);setTimeout(()=>b.remove(),600);$('#feedback').textContent='正しくは '+L.words[id]+'。'+L.tip;active.orbs.forEach(o=>o.el.hidden=true);}else{active.choices[0].classList.add('armed');if(kind==='bottom'&&active.wrong){$('.shared-ring').style.background='#93f4d4';active.choices.forEach(e=>e.classList.toggle('armed',e.textContent===L.words[id]))}$('#feedback').textContent=L.words[id]+' ✓';}stats();if(active.choice&&offset>=-active.window)resolve();}
function resolve(){if(phase!=='flight')return;active.returnScale=Math.max(0,(elapsed-active.start)/active.duration);if(active.choice===null){timeouts++;combo=0;$('#feedback').textContent='時間切れ · 正しくは '+L.words[active.id];}else if(active.choice){hits++;combo++;maxCombo=Math.max(maxCombo,combo);const bonus=Math.min(100,(combo-1)*10);comboBonusTotal+=bonus;const grade=active.grade||'GOOD',base={PERFECT:100,GREAT:70,GOOD:40}[grade];score+=base+bonus;showJudgment(grade);$('#feedback').textContent=combo+' COMBO · +'+(base+bonus)+'点'+(bonus?'（コンボ +'+bonus+'）':'');sound('bounce');}done++;stats();phase='return';until=elapsed+300/rate;}
function next(){if(active.choice){sound('impact');$('#core').classList.add('impact');setTimeout(()=>$('#core').classList.remove('impact'),160)}active.orbs.forEach(o=>o.el.remove());active=null;stepIndex++;if(stepIndex<steps.length){waitForBeat();return}roundIndex++;if(roundIndex<rounds.length){prepareRound();waitForBeat();until+=600/rate;$('#round-notice').hidden=false;$('#feedback').textContent='２周目 · 同じ英文をもう一度';}else finish();}
function tick(now){const delta=Math.min(now-last,80);last=now;if(!paused){elapsed+=delta;if(elapsed>=rhythmOrigin)pulse();if(phase==='count'){$('#overlay').textContent=Math.max(1,Math.ceil((until-elapsed)/(600/rate)));if(elapsed>=until){$('#overlay').hidden=true;launch()}}else if(phase==='gap'&&elapsed>=until)launch();else if(phase==='flight'){const p=Math.max(0,(elapsed-active.start)/active.duration);active.orbs.forEach(o=>{o.el.style.left=(50+(o.pos.x-50)*p)+'%';o.el.style.top=(46+(o.pos.y-46)*p)+'%'});if((active.choice!==null&&p>=1)||(elapsed>=active.start+active.duration+active.window))resolve()}else if(phase==='return'){const p=Math.max(0,(until-elapsed)/(300/rate))*active.returnScale;active.orbs.forEach((o,i)=>{o.el.hidden=!active.choice||i>0;o.el.style.left=(50+(o.pos.x-50)*p)+'%';o.el.style.top=(46+(o.pos.y-46)*p)+'%'});if(elapsed>=until)next()}}if(state==='game')raf=requestAnimationFrame(tick)}
function finish(){state='finish';finalStart=performance.now();finalElapsed=0;finalBonus=0;show('finish');selected=[];bank=shuffle(L.words.map((_,i)=>i));firstCheck=null;$('#check').disabled=false;$('#finalSource').textContent='基本文：'+L.source;$('#finalTask').textContent=L.task;$('#finalFeedback').textContent='語を正しい順に押そう。上の語は押すと戻せます。';$('#listen').disabled=true;renderBank();summary();updateFinalTimer();}
function renderBank(){for(const area of ['answer','bank']){const el=$('#'+area);el.replaceChildren();const ids=area==='answer'?selected:bank.filter(i=>!selected.includes(i));ids.forEach(i=>{const b=document.createElement('button');b.textContent=L.words[i];b.onclick=()=>{if($('#check').disabled)return;say(L.words[i]);if(area==='answer')selected.splice(selected.indexOf(i),1);else selected.push(i);renderBank()};el.append(b)});}}
function speedBonus(seconds){return Math.round(400*L.words.length/(1+seconds/L.words.length))}
function updateFinalTimer(){if(state!=='finish'||$('#check').disabled)return;finalElapsed=(performance.now()-finalStart)/1000;$('#finalTimer').textContent=finalElapsed.toFixed(1)+'秒 · 今なら速さボーナス +'+speedBonus(finalElapsed)+'点';finalFrame=requestAnimationFrame(updateFinalTimer)}
function summary(){$('#summary').textContent=`${score}点 ／ 最大 ${maxCombo} COMBO（加点 ${comboBonusTotal}点） ／ 打ち返し ${hits}回 ／ 誤選択 ${errors}回 ／ 時間切れ ${timeouts}回`+(firstCheck===null?'':` ／ 並び替え初回 ${firstCheck?'○':'×'}`)}
$('#check').onclick=()=>{if($('#check').disabled)return;const ok=selected.length===L.words.length&&selected.every((id,i)=>L.words[id]===L.words[i]);firstCheck??=ok;if(ok){finalElapsed=(performance.now()-finalStart)/1000;finalBonus=speedBonus(finalElapsed);cancelAnimationFrame(finalFrame);score+=200+finalBonus;$('#finalTimer').textContent=finalElapsed.toFixed(1)+'秒で完成 · クリア +200点 ／ 速さ +'+finalBonus+'点';$('#finalFeedback').textContent='正解！ '+L.sentence;$('#finalFeedback').className='correct';$('#check').disabled=true;$('#listen').disabled=false;sound();speak()}else{$('#finalFeedback').textContent='もう一度。'+L.tip;$('#finalFeedback').className='wrong';sound(true)}summary()};
$('#retry').onclick=start;function home(){cancelAnimationFrame(finalFrame);state='home';cancelAnimationFrame(raf);window.speechSynthesis?.cancel();show('home')}$('#quit').onclick=home;$('#back').onclick=home;$('#listen').onclick=()=>speak();
function pause(){if(state!=='game')return;paused=!paused;$('#pause').textContent=paused?'再開':'一時停止';$('#overlay').hidden=!paused;if(paused)$('#overlay').textContent='一時停止';else if(phase==='count')$('#overlay').hidden=false;last=performance.now()}$('#pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='game'&&!paused)pause()});
</script></html>
