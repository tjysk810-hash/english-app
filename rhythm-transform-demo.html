   const ring=document.createElement('span');ring.className='ring shared-ring';ring.style.left=item.x+'%';ring.style.top=item.y+'%';$('#board').append(ring);pairRings[item.id]=ring;
   const options=L.wrong[item.id]?optionOrders[item.pairKey]:[true];pairButtons[item.id]=[];
   options.forEach((correct,i)=>{const b=document.createElement('button');b.className='bottom-choice'+(!correct&&spent.has(item.id)?' spent':'');b.textContent=correct?item.text:L.wrong[item.id];b.style.left=item.x+'%';b.style.top='calc('+item.y+'% + '+(options.length===1?14:i===0?-48:8)+'px)';b.onpointerdown=e=>{if(e.button!==0)return;e.preventDefault();choose(item.id,correct)};b.onclick=e=>{if(e.detail===0)choose(item.id,correct)};$('#board').append(b);pairButtons[item.id].push({el:b,correct});if(correct)item.el=b;});
  }else item.el=addTarget(item);
 });
 if(kind==='double')Object.keys(L.wrong).forEach(key=>{const id=+key,item=dummyLayout[id];item.el=addTarget(item,false);item.el.classList.toggle('spent',spent.has(id))});
}
function launch(){$('#instruction-card').hidden=true;$('#round-notice').hidden=true;sound('launch');const id=steps[stepIndex],wrong=L.wrong[id];layoutStep();active={id,start:elapsed,duration:1800/rate,choice:null,wrong:!!wrong,orbs:[],choices:[]};
 if(kind==='bottom'&&pairButtons[id]){active.choices=pairButtons[id].map(x=>x.el);addOrb(layout[id]);}
 else{layout[id].el.classList.add('active');active.choices.push(layout[id].el);addOrb(layout[id]);if(wrong){const item=dummyLayout[id];item.el.classList.add('active');active.choices.push(item.el);addOrb(item);}}
 const target=active.orbs[0].pos,w=$('#board').clientWidth||362,h=$('#board').clientHeight||420;active.distance=Math.hypot((target.x-50)*w/100,(target.y-46)*h/100);active.window=30/active.distance*active.duration;phase='flight';
}
function fadeDummy(id){if(!L.wrong[id])return;spent.add(id);if(kind==='double')dummyLayout[id].el?.classList.add('spent');else pairButtons[id]?.filter(x=>!x.correct).forEach(x=>x.el.classList.add('spent'))}
function choiceMark(id,correct){const pos=kind==='double'&&!correct&&dummyLayout[id]?dummyLayout[id]:layout[id];const el=document.createElement('span');el.className='choice-mark '+(correct?'yes':'no');el.textContent=correct?'○':'×';el.style.left=pos.x+'%';el.style.top=pos.y+'%';$('#board').append(el);setTimeout(()=>el.remove(),680)}
function addOrb(pos){const el=document.createElement('div');el.className='orb';$('#board').append(el);active.orbs.push({el,pos})}
function timingGrade(offset,duration,distance){const pixels=Math.abs(offset)/duration*distance;return pixels<=8?'PERFECT':pixels<=19?'GREAT':'GOOD'}
function showJudgment(label){const o=active.orbs[0].pos;const el=document.createElement('span');el.className='judgment '+label.toLowerCase();el.textContent=label;el.style.left=o.x+'%';el.style.top=(o.y-8)+'%';$('#board').append(el);setTimeout(()=>el.remove(),720)}
function choose(id,choice){if(state!=='game'||paused||phase!=='flight'||!active||active.choice!==null)return;const offset=elapsed-active.start-active.duration;if(offset>active.window)return;say(choice===false?L.wrong[id]:L.words[id]);if(id!==active.id){choiceMark(id,false);score-=30;errors++;combo=0;sound(true);$('#feedback').textContent='今、玉が向かっている語から選ぼう';stats();return}active.choice=choice!==false;choiceMark(id,active.choice);active.grade=timingGrade(offset,active.duration,active.distance);if(!active.choice){score-=50;errors++;combo=0;sound(true);const pos=kind==='bottom'?layout[id]:active.orbs.at(-1).pos;const b=document.createElement('span');b.className='blast';b.textContent='✹';b.style.left=pos.x+'%';b.style.top=pos.y+'%';$('#board').append(b);setTimeout(()=>b.remove(),600);$('#feedback').textContent='正しくは '+L.words[id]+'。'+L.tip;active.orbs.forEach(o=>o.el.hidden=true);}else{if(kind==='bottom'&&pairRings[id]){pairRings[id].style.background='#93f4d4';pairButtons[id].forEach(x=>x.el.classList.toggle('armed',x.correct))}else layout[id].el.classList.add('armed');$('#feedback').textContent=L.words[id]+' ✓';}stats();if(active.choice&&offset>=-active.window)resolve();}
function resolve(){if(phase!=='flight')return;fadeDummy(active.id);active.returnScale=Math.max(0,(elapsed-active.start)/active.duration);if(active.choice===null){timeouts++;combo=0;$('#feedback').textContent='時間切れ · 正しくは '+L.words[active.id];}else if(active.choice){hits++;combo++;maxCombo=Math.max(maxCombo,combo);const bonus=Math.min(100,(combo-1)*10);comboBonusTotal+=bonus;const grade=active.grade||'GOOD',base={PERFECT:100,GREAT:70,GOOD:40}[grade];score+=base+bonus;showJudgment(grade);$('#feedback').textContent=combo+' COMBO · +'+(base+bonus)+'点'+(bonus?'（コンボ +'+bonus+'）':'');sound('bounce');}done++;stats();phase='return';until=elapsed+300/rate;}
function next(){if(active.choice){sound('impact');$('#core').classList.add('impact');setTimeout(()=>$('#core').classList.remove('impact'),160)}active.orbs.forEach(o=>o.el.remove());active=null;stepIndex++;if(stepIndex<steps.length){waitForBeat();return}roundIndex++;if(roundIndex<rounds.length){if(roundIndex===1)beginInstruction();else{prepareRound();waitForBeat();until+=600/rate;$('#round-notice').textContent='もう１回';$('#round-notice').hidden=false;$('#feedback').textContent='変形文をもう１回';}}else finish();}
const instructionLabels=[['疑問文',''],['否定文',''],['過去形','on Sundays → last Sunday'],['未来の文','will を使う・明日のこと'],['疑問文','過去のことを尋ねる'],['疑問文','主語：He → you'],['過去形','every day → yesterday'],['主語変更','She → They']];
function beginInstruction(){prepareRound();phase='instruction';const beat=600/rate;until=rhythmOrigin+(Math.floor((elapsed-rhythmOrigin)/beat)+1)*beat;instructionDeadline=until+4*beat;const [title,detail]=instructionLabels[problemIndex];$('#instruction-title').textContent=title;$('#instruction-detail').textContent=detail;$('#instruction-card').hidden=false;$('#task').textContent=title+(detail?' · '+detail:'');$('#feedback').textContent='拍に合わせて、文を変えよう';}
function tick(now){const delta=Math.min(now-last,80);last=now;if(!paused){elapsed+=delta;if(elapsed>=rhythmOrigin)pulse();if(phase==='count'){$('#overlay').textContent=Math.max(1,Math.ceil((until-elapsed)/(600/rate)));if(elapsed>=until){$('#overlay').hidden=true;launch()}}else if(phase==='instruction'){if(elapsed>=instructionDeadline)launch();}else if(phase==='gap'&&elapsed>=until)launch();else if(phase==='flight'){const p=Math.max(0,(elapsed-active.start)/active.duration);active.orbs.forEach(o=>{o.el.style.left=(50+(o.pos.x-50)*p)+'%';o.el.style.top=(46+(o.pos.y-46)*p)+'%'});if((active.choice!==null&&p>=1)||(elapsed>=active.start+active.duration+active.window))resolve()}else if(phase==='return'){const p=Math.max(0,(until-elapsed)/(300/rate))*active.returnScale;active.orbs.forEach((o,i)=>{o.el.hidden=!active.choice||i>0;o.el.style.left=(50+(o.pos.x-50)*p)+'%';o.el.style.top=(46+(o.pos.y-46)*p)+'%'});if(elapsed>=until)next()}}if(state==='game')raf=requestAnimationFrame(tick)}
function finish(){state='finish';finalStart=performance.now();finalElapsed=0;finalBonus=0;show('finish');selected=[];bank=shuffle(L.words.map((_,i)=>i));firstCheck=null;completed=false;$('#finalSource').textContent='基本文：'+L.source;$('#finalTask').textContent=L.task;$('#finalFeedback').textContent='語を正しい順に押そう。最後の語を置くと自動判定。上の語は押すと戻せます。';$('#listen').disabled=true;renderBank();summary();updateFinalTimer();}
function renderBank(){for(const area of ['answer','bank']){const el=$('#'+area);el.replaceChildren();const ids=area==='answer'?selected:bank.filter(i=>!selected.includes(i));ids.forEach(i=>{const b=document.createElement('button');b.textContent=L.words[i];b.onclick=()=>{if(completed)return;say(L.words[i]);if(area==='answer')selected.splice(selected.indexOf(i),1);else selected.push(i);renderBank();if(selected.length===L.words.length)checkAnswer()};el.append(b)});}}
function speedBonus(seconds){return Math.round(400*L.words.length/(1+seconds/L.words.length))}
function updateFinalTimer(){if(state!=='finish'||completed)return;finalElapsed=(performance.now()-finalStart)/1000;$('#finalTimer').textContent=finalElapsed.toFixed(1)+'秒 · 今なら速さボーナス +'+speedBonus(finalElapsed)+'点';finalFrame=requestAnimationFrame(updateFinalTimer)}
function summary(){$('#summary').textContent=`${score}点 ／ 最大 ${maxCombo} COMBO（加点 ${comboBonusTotal}点） ／ 打ち返し ${hits}回 ／ 誤選択 ${errors}回 ／ 時間切れ ${timeouts}回`+(firstCheck===null?'':` ／ 並び替え初回 ${firstCheck?'○':'×'}`)}
function checkAnswer(){if(completed)return;const ok=selected.length===L.words.length&&selected.every((id,i)=>L.words[id]===L.words[i]);firstCheck??=ok;if(ok){finalElapsed=(performance.now()-finalStart)/1000;finalBonus=speedBonus(finalElapsed);cancelAnimationFrame(finalFrame);score+=200+finalBonus;$('#finalTimer').textContent=finalElapsed.toFixed(1)+'秒で完成 · クリア +200点 ／ 速さ +'+finalBonus+'点';$('#finalFeedback').textContent='正解！ '+L.sentence;$('#finalFeedback').className='correct';completed=true;$('#listen').disabled=false;sound();speak()}else{$('#finalFeedback').textContent='語順を確認しよう。'+L.tip;$('#finalFeedback').className='wrong';sound(true)}summary()};
$('#retry').onclick=()=>start(problemIndex);$('#next-problem').onclick=()=>start();function home(){sessionToken++;cancelAnimationFrame(finalFrame);state='home';cancelAnimationFrame(raf);window.speechSynthesis?.cancel();show('home')}$('#quit').onclick=home;$('#back').onclick=home;$('#listen').onclick=()=>speak();
function pause(){if(state!=='game')return;paused=!paused;$('#pause').textContent=paused?'再開':'一時停止';$('#overlay').hidden=!paused;if(paused){$('#overlay').textContent='一時停止';window.speechSynthesis?.pause()}else{window.speechSynthesis?.resume();if(phase==='count')$('#overlay').hidden=false;}last=performance.now()}$('#pause').onclick=pause;document.addEventListener('visibilitychange',()=>{if(document.hidden&&state==='game'&&!paused)pause()});
</script></html>
