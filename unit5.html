</style></head><body><div id="app"></div><dialog id="sheet"></dialog><script>const QUESTIONS=[];
function add(cat,prompt,answer,wrong,explain,extra={}){ QUESTIONS.push({id:cat+'-'+(QUESTIONS.filter(q=>q.cat===cat).length+1),cat,prompt,answer,choices:[answer,...wrong],explain,...extra}); }
const WORDS=[
['universal','すべての人の','p.60'],['design','デザイン・設計','p.60'],['fair','展示会','p.60'],['bottle','びん・ボトル','p.60'],['automatic','自動の','p.60'],['adjustable','調節できる','p.60'],['public','公共の','p.60'],['touch','触れる','p.60'],['product','製品','p.60'],['facility','施設','p.60'],['city hall','市役所','p.60'],['staff','職員・スタッフ','p.61'],['tap','軽くたたく','p.61'],['both','両方の','p.61'],['left-handed','左利きの','p.61'],['right-handed','右利きの','p.61'],['thanks to','〜のおかげで','p.61'],['over here','こちらに','p.61'],['useful','役に立つ','p.62'],['mean','意味する','p.62'],['sign','標識','p.62'],['ramp','スロープ','p.62'],['stairs','階段','p.62'],['wheelchair','車いす','p.62'],['baggage','荷物','p.62'],['heavy','重い','p.62'],['the elderly','高齢者','p.62'],['presentation','発表','p.62'],['professor','教授','p.64'],['childhood','子ども時代','p.64'],['remove','取り除く','p.64'],['barrier','障壁','p.64'],['ability','能力','p.64'],['situation','状況','p.64'],['founded','設立した','p.64'],['spread','広める・広めた','p.64'],['accessible','利用しやすい','p.64'],['regardless of','〜に関係なく','p.64'],['disabled','障害のある','p.64'],['restroom','トイレ','p.64']
];
WORDS.forEach(([en,ja,page],i)=>{const others=[1,7,13].map(n=>WORDS[(i+n)%WORDS.length]); add('word',en,ja,others.map(x=>x[1]),`${en}：${ja}`,{direction:'英語 → 日本語',page}); add('word',ja,en,others.map(x=>x[0]),`${en}：${ja}`,{direction:'日本語 → 英語',page});});
const SDGS=[['poverty','貧困','No poverty'],['hunger','飢餓','Zero hunger'],['health','健康','Good health and well-being'],['education','教育','Quality education'],['equality','平等','Gender equality'],['water','水','Clean water and sanitation'],['energy','エネルギー','Affordable and clean energy'],['work','仕事','Decent work and economic growth']];
SDGS.forEach(([en,ja,label],i)=>add('extra',label.replace(new RegExp(en,'i'),'（　）'),en,[1,3,5].map(n=>SDGS[(i+n)%8][0]),`${label}：${ja}に関する目標。`,{page:'p.68',hint:`SDGs 目標${i+1} · ${ja}`}));

// Independently written situations for grammar practice.
const GRAMMAR = [
['Mika learned (　) to bake bread.','how',['where','when','what'],'「焼き方」はhow to bake。learnedの後に学んだ内容を続けます。','ミカはパンの焼き方を学びました。'],
['We must decide (　) to start the game.','when',['what','who','that'],'開始する「時」を決めるのでwhen to startを使います。','私たちはいつ試合を始めるか決めなければなりません。'],
['Ken cannot decide (　) to cook tonight.','what',['that','who','which of'],'「何を料理するか」はwhat to cook。whatがcookの目的語の働きをします。','ケンは今夜何を料理するか決められません。'],
['Do you know where to (　) your bike?','park',['parks','parked','parking'],'疑問詞＋toの後に来る動詞は原形です。parkは「駐輪する・駐車する」。','自転車をどこに止めればよいか知っていますか。'],
['My brother showed (　) how to play chess.','me',['my','mine','I'],'showedの後の「私に」は目的格me。続くhow to play chessが教えた内容です。','兄は私にチェスのやり方を教えてくれました。'],
['Please tell Aya (　) to put her bag.','where',['what','who','that'],'置く「場所」を尋ねるのでwhere to putを使います。','アヤにかばんをどこに置けばよいか教えてください。'],
['Our coach is sure (　) we can win tomorrow.','that',['to','what','how to'],'確信の内容を述べるには、sure thatの後に文を続けます。','コーチは私たちが明日勝てると確信しています。'],
['I am glad that you (　) my cake yesterday.','liked',['like','likes','liking'],'yesterdayがあるので過去形liked。「あなたがケーキを気に入った」ことを喜んでいます。','昨日あなたが私のケーキを気に入ってくれてうれしいです。'],
['Sora plays both soccer (　) tennis.','and',['or','but','so'],'both A and Bは２つを並べて「AもBも」と表します。','ソラはサッカーもテニスもします。'],
['(　) your advice, I finished my homework.','Thanks to',['Instead of','Next to','Regardless of'],'助言がよい結果につながったことをThanks toで表します。','あなたの助言のおかげで、宿題を終えました。'],
['Why don’t you (　) a short break?','take',['takes','taking','took'],'Why don’t you＋動詞の原形は提案。take a breakで「休憩する」です。','少し休憩してはどうですか。'],
['You can join our club regardless (　) experience.','of',['to','for','with'],'regardless ofで「〜に関係なく」。experienceは「経験」です。','経験に関係なく私たちのクラブに入れます。']
];
GRAMMAR.forEach(([prompt,answer,wrong,explain,hint],i)=>QUESTIONS.push({id:'grammar-v2-'+(i+1),cat:'grammar',prompt,answer,choices:[answer,...wrong],explain,hint,page:'オリジナル問題'}));
const ORDER = [
['ユイは卵のゆで方を学びました。',['Yui','learned','how','to','boil','an egg'],'how to boil＝「どのようにゆでるか」。learnedの後に学んだ内容を置きます。','疑問詞＋to'],
['私たちはいつ昼食を食べるか決めました。',['We','decided','when','to','have','lunch'],'when to have lunchが「いつ昼食を食べるか」という、決めた内容です。','疑問詞＋to'],
['リクはどこで靴を買えばよいか知っています。',['Riku','knows','where','to','buy','shoes'],'場所を表すwhere＋to＋動詞の原形。主語がRikuなのでknowsです。','疑問詞＋to'],
['私は次に何を書けばよいかわかりません。',['I',"don't",'know','what','to','write next'],'what to write nextは「次に何を書くか」。否定はdon’t knowです。','疑問詞＋to'],
['父はこの曲の歌い方を覚えています。',['My father','remembers','how','to','sing','this song'],'how to sing this songというまとまりで「この曲の歌い方」を表します。','疑問詞＋to'],
['姉は私にスープの作り方を教えてくれました。',['My sister','showed','me','how','to','make','soup'],'showed＋人＋how to …で「人に〜の仕方を教えた」。','show＋人＋疑問詞＋to'],
['いつ練習を始めればよいかチームに教えてください。',['Please','tell','the team','when','to','start','practice'],'tellの後に相手のthe team、その後にwhen to start practiceを置きます。','tell＋人＋疑問詞＋to'],
['コーチは私たちに速く泳ぐ方法を教えてくれました。',['Our coach','showed','us','how','to','swim','fast'],'「私たちに」はus。how to swim fastが教わった内容です。','show＋人＋疑問詞＋to'],
['タクはどこで待てばよいかエミに教えられます。',['Taku','can','tell','Emi','where','to','wait'],'tell Emi where to waitの順で「エミに待つ場所を教える」です。','tell＋人＋疑問詞＋to'],
['何を注文すればよいか私に教えてください。',['Please','tell','me','what','to','order'],'what to orderは「何を注文するか」。tell meの後に続けます。','tell＋人＋疑問詞＋to'],
['私は私たちのチームが勝つと確信しています。',['I','am','sure','that','our team','will','win'],'sure thatの後にour team will winという文を置きます。','that節'],
['あなたが無事だとわかってうれしいです。',['I','am','glad','that','you','are','safe'],'glad thatの後に、喜んでいる理由のyou are safeを続けます。','that節'],
['ミナは数学がおもしろいと思っています。',['Mina','thinks','that','math','is','interesting'],'thinks thatの後に、考えの内容を主語＋動詞で述べます。','that節'],
['私たちはハルが時間どおりに来ると確信しています。',['We','are','sure','that','Haru','will','come','on time'],'We are sure that …で「私たちは〜と確信している」。on timeは「時間どおりに」。','that節'],
['母は私が部屋を掃除したことを喜んでいます。',['My mother','is','glad','that','I','cleaned','my room'],'glad thatの後にI cleaned my roomという過去の出来事を続けます。','that節'],
['私たちは夕食に何を作るか決めなければなりません。',['We','must','decide','what','to','make','for dinner'],'must decideで「決めなければならない」。what to makeが決める内容です。','疑問詞＋to'],
['レンはどこで乗り換えればよいか尋ねました。',['Ren','asked','where','to','change trains'],'where to change trainsは「どこで乗り換えるか」。','疑問詞＋to'],
['アヤはギターの弾き方を学びたいと思っています。',['Aya','wants','to','learn','how','to','play','the guitar'],'wants to learnの後に、学びたい内容のhow to play the guitarを続けます。','疑問詞＋to'],
['いつその犬にえさをあげればよいか私に教えてください。',['Please','tell','me','when','to','feed','the dog'],'when to feed the dogで「いつその犬にえさをあげるか」。','tell＋人＋疑問詞＋to'],
['弟はそのパズルを解く方法を私に教えてくれました。',['My brother','showed','me','how','to','solve','the puzzle'],'showed meの後に、方法を表すhow to solve the puzzleを置きます。','show＋人＋疑問詞＋to'],
['エミはその映画が楽しいものになると確信しています。',['Emi','is','sure','that','the movie','will','be','fun'],'thatの後はthe movie will be funという文。willの後はbeです。','that節'],

</script><script>// Pure scheduling and history logic, shared by the app and validation.
const Engine={
 day(now=new Date()){return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;},
 record(hist,id,correct,day,retry=false){const old=hist[id]||[];if(retry||old.at(-1)?.day===day)return false;hist[id]=[...old,{ok:correct,day}].slice(-2);return true;},
 group(hist,id){const h=hist[id]||[];return !h.length?'new':!h.at(-1).ok?'wrong':h.length===2&&h[0].ok?'stable':'check';},
 queue(qs,hist,seen,count=10,day=Engine.day()){
 const groups={wrong:[],new:[],check:[],stable:[]};
 for(const q of qs)groups[Engine.group(hist,q.id)].push(q);
 for(const arr of Object.values(groups))arr.sort((a,b)=>{
 const ah=hist[a.id]||[],bh=hist[b.id]||[];
 return Number(ah.at(-1)?.day===day)-Number(bh.at(-1)?.day===day)||(seen[a.id]||0)-(seen[b.id]||0);});
 const pattern=['wrong','new','check','new','wrong','stable','new','check','wrong','new'];const out=[];
 for(let i=0;i<Math.min(count,qs.length);i++){
 let pool=groups[pattern[i%pattern.length]];if(!pool.length)pool=['wrong','new','check','stable'].map(k=>groups[k]).find(a=>a.length);
 // Balance categories within each priority group, favoring less-practiced problems.
 const counts={};out.forEach(q=>counts[q.cat]=(counts[q.cat]||0)+1);
 const firstSeen=seen[pool[0].id]||0;
 let candidates=pool.filter(q=>(seen[q.id]||0)===firstSeen);
 candidates.sort((a,b)=>(counts[a.cat]||0)-(counts[b.cat]||0));
 const q=candidates[0]||pool[0];pool.splice(pool.indexOf(q),1);out.push(q);
 }return out;
 }
};
if(typeof module!=='undefined')module.exports=Engine;
</script><script>const $=s=>document.querySelector(s), app=$('#app'), sheet=$('#sheet');
const CATS={word:'単語',grammar:'文法',order:'並び替え',extra:'SDGs'};
const KEY='unit5-learning-v1';let state={hist:{},seen:{},counter:0},storageOK=true;
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s&&typeof s==='object'){state.hist=s.hist&&typeof s.hist==='object'?s.hist:{};state.seen=s.seen&&typeof s.seen==='object'?s.seen:{};state.counter=Number(s.counter)||0;for(const [id,h]of Object.entries(state.hist)){if(!Array.isArray(h))delete state.hist[id];else state.hist[id]=h.filter(x=>x&&typeof x.ok==='boolean'&&typeof x.day==='string').slice(-2);}}}catch{storageOK=false;}
const validIds=new Set(QUESTIONS.map(q=>q.id));for(const id of Object.keys(state.hist))if(!validIds.has(id))delete state.hist[id];for(const id of Object.keys(state.seen))if(!validIds.has(id))delete state.seen[id];
let tab='word',scope='nonword',session=null;
function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch{storageOK=false;}}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function marks(id){const h=state.hist[id]||[];return '<span class="hist">'+[...Array(2-h.length).fill(null),...h].map(x=>`<span class="${x===null?'dot':x.ok?'yes':'no'}">${x===null?'・':x.ok?'○':'×'}</span>`).join('')+'</span>';}
function home(){stopClock();session=null;const list=QUESTIONS.filter(q=>q.cat===tab);const core=QUESTIONS.filter(q=>q.cat!=='extra'),done=core.filter(q=>state.hist[q.id]?.length).length;const review=core.filter(q=>state.hist[q.id]?.at(-1)?.ok===false).length;
app.innerHTML=`<header><div class="brand"><i>↗</i> ENGLISH STEPS</div><button class="icon" id="help" aria-label="使い方">?</button></header><section class="hero"><p class="eyebrow">UNIT 05 · ENGLISH PRACTICE</p><h1>Unit 5 <small>学習マップ</small></h1><p class="subtitle">疑問詞＋to・that節と関連表現</p><div class="mark" aria-hidden="true">✳</div></section><div class="progressline"><div class="track"><span style="width:${done/core.length*100}%"></span></div><span>${done} / ${core.length} 問に挑戦</span></div><section class="autobox"><div class="auto-buttons"><button class="primary" id="auto-word">単語 <span>5問</span></button><button class="primary" id="auto-other">単語以外 <span>5問</span></button></div><div class="autosettings"><span>${review?`要復習 ${review}問`:'単語5問＋単語以外5問から'}</span><span>文法・並び替え</span></div></section><div class="maphead"><strong>問題を選ぶ</strong><span>全${list.length}問 · マスを押して選ぶ</span></div><nav class="tabs" aria-label="問題の分野">${Object.entries(CATS).map(([k,v])=>`<button data-tab="${k}" class="${tab===k?'active':''}" aria-pressed="${tab===k}">${v}</button>`).join('')}</nav><div class="grid">${list.map((q,i)=>{let h=state.hist[q.id]||[],g=Engine.group(state.hist,q.id);return `<button class="cell ${g==='wrong'?'review':g==='stable'?'done':g==='check'?'once':''}" data-id="${q.id}" aria-label="${CATS[q.cat]} ${i+1}番 ${h.map(x=>x.ok?'正解':'間違い').join('、')||'未学習'}"><strong>${String(i+1).padStart(2,'0')}</strong>${marks(q.id)}</button>`;}).join('')}</div><div class="legend"><span>・未学習</span><span class="yes">○ 正解</span><span class="no">× 要復習</span><span>左：前回 → 右：最新</span></div><footer class="foot"><span>${tab==='extra'?'追加練習 · p.68':'Unit 5 · 英語練習'} · ${storageOK?'この端末に自動保存':'保存できません'}</span><button class="link" id="records">記録について</button></footer>${!storageOK?'<p class="notice">ブラウザの保存機能が使えません。閉じると記録が失われる場合があります。</p>':''}`;
$('#auto-word').onclick=()=>startAuto('word');$('#auto-other').onclick=()=>startAuto('nonword');$('#help').onclick=help;$('#records').onclick=help;
app.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;home();});app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id));}
function modal(html){sheet.innerHTML='<button class="close" aria-label="閉じる">×</button>'+html;sheet.querySelector('.close').onclick=()=>sheet.close();if(!sheet.open)sheet.showModal();}
function help(){modal(`<p class="eyebrow">HOW TO USE</p><h2>選んでも、おまかせでも。</h2><div class="help-row"><strong>▶ 単語／単語以外の5問</strong>分野を分けてランダムに出題します。間違えた問題・未学習・正解済みを混ぜて5問。全問終わった後も、最近出ていない問題から周回できます。</div><div class="help-row"><strong>短い時間で、まず挑戦</strong>単語10秒・文法とSDGs15秒・並び替え30秒。時間切れは×として復習対象になります。誤答・時間切れの後は、黄色のポイントをタップして確認すると次へ進めます。答えの確認中には制限時間はありません。</div><div class="help-row"><strong>直近２回だけ記録</strong>左が前回、右が最新。１問につき１日最初の解答だけを記録し、古い結果から上書きします。直後の解き直しは記録しません。</div><div class="help-row"><strong>○ × は、今の学習の足あと</strong>×は要復習、×○は再確認中、○○は２日分の正解です。何回でも練習できます。</div><div class="help-row"><strong>並び替えの操作</strong>単語を順番にタップ。選んだ単語を押すと戻せます。</div><div class="help-row"><strong>記録はこのブラウザに保存</strong>別端末とは同期しません。ブラウザのデータを削除すると記録も消えます。端末の日付で１日を区切ります。</div><p class="tiny">文法・並び替えはオリジナルの練習問題です。音声問題と英作文は収録していません。SDGsは語句の追加練習です。</p>`);}
function detail(id){const q=QUESTIONS.find(q=>q.id===id),h=state.hist[id]||[],arr=[...Array(2-h.length).fill(null),...h];modal(`<p class="eyebrow">${CATS[q.cat]} · ${q.page}</p><h2>${q.cat==='word'?esc(q.prompt):CATS[q.cat]+' '+id.split('-').at(-1)}</h2><p>${q.cat==='word'?esc(q.direction):q.cat==='order'?'単語を順にタップして英文を作ろう。':'空欄に入る語句を選ぼう。'}</p><div class="historyrow">${arr.map((x,i)=>`<div class="historyitem">${i?'最新':'前回'}<b class="${x?(x.ok?'yes':'no'):'dot'}">${x?(x.ok?'○':'×'):'・'}</b>${x?esc(x.day):'未学習'}</div>`).join('')}</div><p class="tiny">${h.at(-1)?.day===Engine.day()?'今日は練習として解けます。履歴は変更しません。':'今回の解答を履歴に記録します。'}</p><button class="primary" id="single">この問題を解く →</button>`);$('#single').onclick=()=>{sheet.close();start([q],false,false);};}
function startAuto(mode=scope){scope=typeof mode==='string'?mode:scope;const pool=QUESTIONS.filter(q=>scope==='word'?q.cat==='word':['grammar','order'].includes(q.cat));start(Engine.queue(shuffle(pool),state.hist,state.seen,5),false,true);}
function start(qs,retry=false,auto=false){stopClock();session={qs,index:0,retry,auto,results:[],picked:[],answered:false};quiz();window.scrollTo(0,0);}
function quiz(){stopClock();let s=session,q=s.qs[s.index];s.answered=false;s.attempted=false;s.hadError=false;s.recorded=false;s.picked=[];s.options=q.choices?shuffle(q.choices):null;s.bank=q.tokens?shuffle(q.tokens.map((text,i)=>({text,i}))):null;
app.innerHTML=`<div class="quiztop"><button class="back" id="exit">← マップ</button><span>${s.retry?'解き直し':s.auto?'オート出題':'個別練習'} ${s.index+1} / ${s.qs.length}</span></div><div class="track"><span style="width:${s.index/s.qs.length*100}%"></span></div><div class="timer" role="timer" aria-label="残り時間"><span>残り <strong id="seconds"></strong> 秒</span><div class="time-track"><span id="time-fill"></span></div></div><div class="qheader"><span class="pill">${CATS[q.cat]}${q.direction?' · '+q.direction:''}</span><span class="tiny">${q.page}</span></div><h2 class="qprompt ${q.cat==='word'&&q.direction==='英語 → 日本語'?'english':''}">${esc(q.prompt)}</h2>${q.hint?`<p class="hint">${esc(q.hint)}</p>`:''}${q.tokens?'<p class="tiny">単語を順にタップ。選んだ単語はタップで戻せます。</p><div id="ordering"></div>':`<div class="choices">${s.options.map((o,i)=>`<button class="choice" data-choice="${i}"><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}</div>`}<div id="feedback" aria-live="polite"></div><p class="tiny" style="margin-top:20px">${s.retry?'解き直しは履歴に含みません。':state.hist[q.id]?.at(-1)?.day===Engine.day()?'今日は解答済みのため、練習として出題します。':'今日最初の解答を履歴に記録します。'}</p>`;
$('#exit').onclick=()=>{if(s.results.length||s.index===0){home();window.scrollTo(0,0);}else home();};if(q.tokens)renderOrder();else app.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(s.options[Number(b.dataset.choice)]));startClock(q);}
function renderOrder(){const s=session,q=s.qs[s.index];$('#ordering').innerHTML=`<div class="answerline">${s.picked.length?s.picked.map((idx,pos)=>`<button class="token" data-remove="${pos}" ${s.answered?'disabled':''}>${esc(q.tokens[idx])}</button>`).join(''):'<span class="emptyhint">ここに英文ができます</span>'}</div><div class="wordbank">${s.bank.map(t=>`<button class="token" data-token="${t.i}" ${s.picked.includes(t.i)||s.answered?'disabled':''}>${esc(t.text)}</button>`).join('')}</div><button class="primary" id="check" ${s.picked.length!==q.tokens.length||s.answered?'disabled':''}>答え合わせ</button>`;app.querySelectorAll('[data-token]').forEach(b=>b.onclick=()=>{if(s.answered)return;s.picked.push(Number(b.dataset.token));renderOrder();});app.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{if(s.answered)return;s.picked.splice(Number(b.dataset.remove),1);renderOrder();});$('#check').onclick=()=>answer(s.picked.map(i=>q.tokens[i]).join(' '));}
const LIMITS={word:10,grammar:15,extra:15,order:30};let clockId=null;
function stopClock(){if(clockId!==null)clearInterval(clockId);clockId=null;}
function startClock(q){session.limit=LIMITS[q.cat];session.deadline=Date.now()+session.limit*1000;tickClock();clockId=setInterval(tickClock,200);}
function tickClock(){if(!session||session.answered){stopClock();return}const remaining=Math.max(0,session.deadline-Date.now()),seconds=Math.ceil(remaining/1000);const el=$('#seconds'),fill=$('#time-fill');if(el)el.textContent=seconds;if(fill)fill.style.width=(remaining/(session.limit*1000)*100)+'%';if(remaining<=0)answer(null,true);}
document.addEventListener('visibilitychange',()=>{if(session&&!session.answered)tickClock()});
function pointFor(q){
 if(q.cat==='grammar'){const points=['how to bake','when to start','what to cook','to park','showed me','where to put','sure that','liked','both soccer and tennis','Thanks to','Why don’t you take','regardless of'];return points[Number(q.id.split('-').at(-1))-1]||q.answer;}
 if(q.cat!=='order')return q.answer;
 const patterns=[/(?:how|when|what|where) to \w+/i,/Why don't you \w+/i,/both .+ and .+/i,/Thanks to/i,/regardless of/i,/There (?:is|are)/i,/If you are hungry/i,/started to clean/i,/wanted to become/i,/can speak/i,/is making/i,/useful for studying/i,/spread/i,/that .+/i];
 for(const re of patterns){const m=q.answer.match(re);if(m)return m[0]}
 return q.answer;
}
function fullAnswer(q){return q.cat==='grammar'?q.prompt.replace('(　)',q.answer):q.cat==='extra'?q.prompt.replace('（　）',q.answer):q.cat==='order'?q.answer+(q.endMark||'.'):q.prompt+' → '+q.answer;}
function reviewMarkup(q){const text=fullAnswer(q),point=pointFor(q),at=text.indexOf(point);return esc(text.slice(0,at))+'<button class="focus-point" id="review-point" aria-label="正解のポイント '+esc(point)+' を確認">'+esc(point)+'</button>'+esc(text.slice(at+point.length));}
function answer(value,timedOut=false){const s=session;if(!s||s.answered)return;timedOut=timedOut||Date.now()>=s.deadline;stopClock();const q=s.qs[s.index],ok=!timedOut&&value===q.answer;
 if(!s.attempted){s.attempted=true;s.recorded=Engine.record(state.hist,q.id,ok,Engine.day(),s.retry);if(!s.retry)state.seen[q.id]=++state.counter;save();s.results.push({q,ok,timedOut});}
 s.answered=true;s.reviewed=ok;if(q.tokens)renderOrder();else app.querySelectorAll('[data-choice]').forEach(b=>{b.disabled=true;const v=s.options[Number(b.dataset.choice)];if(v===q.answer)b.classList.add('correct');else if(v===value)b.classList.add('wrong');});
 $('#feedback').innerHTML=`<section class="feedback ${ok?'':'wrong needs-review'}"><h3>${ok?'○ 正解！':timedOut?'時間です。答えを確認しよう':'正解のポイントを覚えよう'}</h3>${ok?`<div class="correct-sentence">${esc(fullAnswer(q))}</div>`:`<div class="focus-label">ここが大事！</div><p class="focus-instruction">黄色の部分を見て、タップしよう ↓</p><div class="correct-sentence">${reviewMarkup(q)}</div>`}<p class="explanation">${esc(q.explain)}</p><div id="review-confirmation" aria-live="polite"></div><p class="tiny">${timedOut?'時間切れは復習する問題として扱います。 ':''}${s.recorded?'今回の結果を記録しました。':'練習のため履歴は変更していません。'}${!storageOK?' 記録を保存できませんでした。':''}</p><button class="primary" id="continue" ${ok?'':'hidden'}>${s.index+1===s.qs.length?'結果を見る':'次の問題へ'} →</button></section>`;
 if(!ok)$('#review-point').onclick=()=>{if(s.reviewed)return;s.reviewed=true;$('#review-point').disabled=true;$('#review-point').classList.add('checked');$('#review-confirmation').innerHTML=`<div class="remember"><strong>✓ ポイントを確認！</strong><div>${esc(pointFor(q))}</div><p>${esc(q.cat==='word'?q.explain:q.hint||q.explain)}</p></div>`;$('#continue').hidden=false;};
 $('#continue').onclick=()=>{if(!s.reviewed)return;s.index++;if(s.index===s.qs.length)finish();else quiz();window.scrollTo(0,0);};$('#feedback').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function finish(){stopClock();const s=session,correct=s.results.filter(r=>r.ok).length,wrong=s.results.filter(r=>!r.ok).map(r=>r.q);app.innerHTML=`<header><div class="brand"><i>↗</i> ENGLISH STEPS</div></header><section class="result"><div class="resulticon">${wrong.length?'↗':'✳'}</div><p class="eyebrow">${s.retry?'PRACTICE COMPLETE':'SESSION COMPLETE'}</p><h1>おつかれさま！</h1><div class="score">${correct}<small> / ${s.qs.length}</small></div><p>${wrong.length?`最初の解答で間違えた${wrong.length}問を、また練習しよう。`:'この調子。次の5問にも挑戦できます。'}<br>${s.retry?'解き直しの結果は履歴に含めていません。':'同日２回目以降の解答は練習として扱います。'}</p></section>${wrong.length?'<button class="primary" id="retry">間違えた問題を解き直す</button>':''}<button class="${wrong.length?'secondary':'primary'}" id="again">次のオート出題 · 5問 →</button><button class="secondary" id="home">学習マップに戻る</button>`;if(wrong.length)$('#retry').onclick=()=>start(wrong,true,false);$('#again').onclick=startAuto;$('#home').onclick=home;}
sheet.addEventListener('click',e=>{if(e.target===sheet){const r=sheet.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)sheet.close();}});home();
</script></body></html>
